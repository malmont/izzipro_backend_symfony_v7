# Services propres à l'environnement de test
services:
    # Aucun appel réel à l'API Anthropic pendant les tests
    App\Services\AnthropicService:
        class: App\Tests\Fake\FakeAnthropicService
        arguments:
            $httpClient: '@http_client'
            $anthropicApiKey: 'test-sans-appel-reel'
            $logger: '@logger'
        public: true

    # Assistant IA des landing pages : client Anthropic simulé (réponses scriptées par les tests)
    App\Tests\Fake\FakeLandingAiClient:
        public: true
    App\Services\LandingAiService\LandingAiClientInterface: '@App\Tests\Fake\FakeLandingAiClient'
