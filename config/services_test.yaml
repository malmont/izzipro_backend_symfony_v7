# Services propres à l'environnement de test
services:
    # Aucun appel réel à l'API Anthropic pendant les tests
    App\Services\AnthropicService:
        class: App\Tests\Fake\FakeAnthropicService
        arguments:
            $httpClient: '@http_client'
            $anthropicApiKey: 'test-sans-appel-reel'
            $logger: '@logger'
        public: true

    # Aucun appel réel à Whisper (OpenAI) pendant les tests : transcription fixée par les tests
    App\Services\OpenAiService:
        class: App\Tests\Fake\FakeOpenAiService
        arguments:
            $httpClient: '@http_client'
            $openAiApiKey: 'test-sans-appel-reel'
            $logger: '@logger'
        public: true

    # Rédaction payante : RevenueCat simulé (achats scriptés par les tests) ; Lulu sans clé = simulation (aucun appel)
    App\Tests\Fake\FakeRevenueCatClient:
        public: true
    App\MemoiresVivantes\Services\RevenueCat\RevenueCatClientInterface: '@App\Tests\Fake\FakeRevenueCatClient'
    App\MemoiresVivantes\Services\LuluPrintService:
        autowire: true
        arguments:
            $luluClientKey: null
            $luluClientSecret: null

    # Assistant IA des landing pages : client Anthropic simulé (réponses scriptées par les tests)
    App\Tests\Fake\FakeLandingAiClient:
        public: true
    App\Services\LandingAiService\LandingAiClientInterface: '@App\Tests\Fake\FakeLandingAiClient'

    # Synchronisation de la configuration des landing pages : faux frontend (aucun appel réseau)
    App\Tests\Fake\FakeFrontendConfigHttpClient:
        public: true
    App\Services\LandingConfigService\FrontendConfigFetcher:
        arguments:
            $httpClient: '@App\Tests\Fake\FakeFrontendConfigHttpClient'
            $baseUrl: !php/const App\Tests\Fake\FakeFrontendConfigHttpClient::BASE_URL

    # Médiathèque : aucun ffmpeg pendant les tests
    App\Tests\Fake\FakeScrollVideoEncoder:
        public: true
    App\Services\SharedMedia\ScrollVideoEncoderInterface: '@App\Tests\Fake\FakeScrollVideoEncoder'
    App\MessageHandler\PrepareScrollVideoHandler:
        autowire: true
        autoconfigure: true
        public: true

    # Abonnements : Stripe Billing simulé (aucun appel réseau)
    App\Tests\Fake\FakeSubscriptionStripeGateway:
        autowire: true
        public: true
    App\Services\SubscriptionService\SubscriptionStripeGatewayInterface: '@App\Tests\Fake\FakeSubscriptionStripeGateway'
    # Paiements du panier : intents simulés (aucun appel réseau)
    App\Tests\Fake\FakeCheckoutPaymentGateway:
        autowire: true
    App\Services\CheckoutService\CheckoutPaymentGatewayInterface: '@App\Tests\Fake\FakeCheckoutPaymentGateway'
