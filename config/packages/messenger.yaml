# config/packages/messenger.yaml

framework:
    messenger:
        buses:
            messenger.bus.default:
                middleware:
                    - 'App\Messenger\TenantRoutingMiddleware'

        # A. On définit nos "camions de livraison" (Transports)
        transports:
            # On lui donne un nom, "async" est la convention (conservé en fallback)
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: 'gemsuite_setup'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0

            # Partitions pour équilibrer la charge par Tenant ID
            async_worker_1:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: 'gemsuite_worker_1'
                    delete_after_ack: false
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0

            async_worker_2:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: 'gemsuite_worker_2'
                    delete_after_ack: false
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0

            async_worker_3:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: 'gemsuite_worker_3'
                    delete_after_ack: false
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0

        # B. On définit le "centre de tri" (Routage)
        routing:
            # Règle de fallback (les messages seront de toute façon interceptés par le middleware si getTenantId() existe)
            'App\Message\TenantJobInterface': async_worker_1