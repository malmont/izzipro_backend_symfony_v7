# config/packages/messenger.yaml

framework:
    messenger:
        # Messages dont toutes les tentatives ont échoué : conservés pour inspection / relance
        # (messenger:failed:show, messenger:failed:retry) au lieu d'être perdus
        failure_transport: failed

        # Une file et un worker par projet (docker-compose.yml) : une génération de chapitre ne bloque ni les rapports
        # ESG ni l'assistant des landing pages, et inversement. Files isolées dans la base Redis 1 : le cache
        # applicatif (base 0) peut être vidé sans effacer les messages en attente ni casser les groupes de consommateurs.
        # Le nom de la file est le chemin du DSN (…/messages, …/messages_esg…) : l'option « stream » est ignorée quand
        # le DSN a un chemin, et tous les workers liraient alors la même file.
        transports:
            # Mémoires Vivantes (génération des chapitres) — nom historique conservé
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    dbindex: 1
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0
            # Boussole ESG (rapports PDF)
            esg:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_esg'
                options:
                    dbindex: 1
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0
            # Assistant IA des landing pages (mode page, images) : jamais relancé, le handler écrit lui-même les
            # erreurs dans la tâche (une relance repayerait un appel à l'IA)
            landing_ai:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_landing_ai'
                options:
                    dbindex: 1
                retry_strategy:
                    max_retries: 0
            # Médiathèque (préparation des vidéos pour les scènes au défilement, par ffmpeg) : jamais relancé, le
            # handler note lui-même l'échec sur le média
            media:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_media'
                options:
                    dbindex: 1
                retry_strategy:
                    max_retries: 0
            # Courriels de tous les sites (09/10/2026) : la requête n'attend plus le serveur SMTP. Relances espacées
            # (30 s, 2 min, 8 min) pour un serveur momentanément indisponible, puis file « failed »
            email:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_email'
                options:
                    dbindex: 1
                retry_strategy:
                    max_retries: 3
                    delay: 30000
                    multiplier: 4
                    max_delay: 0
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_failed'
                options:
                    dbindex: 1

        routing:
            'App\MemoiresVivantes\Message\GenerateChapterMessage': async
            'App\ESG\Message\GenerateEsgReportMessage': esg
            'App\Message\LandingAiJobMessage': landing_ai
            'App\Message\PrepareScrollVideoMessage': media
            'App\Message\SendTenantEmailMessage': email

# Tests : Messenger en mémoire (tests/bootstrap.php) ; les courriels partent tout de suite (vers null://) pour que les
# tests lisent les messages envoyés
when@test:
    framework:
        messenger:
            transports:
                email: 'sync://'
