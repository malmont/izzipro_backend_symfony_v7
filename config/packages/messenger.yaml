# config/packages/messenger.yaml

framework:
    messenger:
        # Messages dont toutes les tentatives ont échoué : conservés pour inspection / relance
        # (messenger:failed:show, messenger:failed:retry) au lieu d'être perdus
        failure_transport: failed

        # Une file et un worker par projet (docker-compose.yml) : une génération de chapitre ne bloque ni les rapports
        # ESG ni l'assistant des landing pages, et inversement. Files isolées dans la base Redis 1 : le cache
        # applicatif (base 0) peut être vidé sans effacer les messages en attente ni casser les groupes de consommateurs.
        # Le nom de la file est le chemin du DSN (…/messages, …/messages_esg…) : l'option « stream » est ignorée quand
        # le DSN a un chemin, et tous les workers liraient alors la même file.
        transports:
            # Mémoires Vivantes (génération des chapitres) — nom historique conservé
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    dbindex: 1
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0
            # Boussole ESG (rapports PDF)
            esg:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_esg'
                options:
                    dbindex: 1
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0
            # Assistant IA des landing pages (mode page, images) : jamais relancé, le handler écrit lui-même les
            # erreurs dans la tâche (une relance repayerait un appel à l'IA)
            landing_ai:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_landing_ai'
                options:
                    dbindex: 1
                retry_strategy:
                    max_retries: 0
            # Médiathèque (préparation des vidéos pour les scènes au défilement, par ffmpeg) : jamais relancé, le
            # handler note lui-même l'échec sur le média
            media:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_media'
                options:
                    dbindex: 1
                retry_strategy:
                    max_retries: 0
            # Courriels de tous les sites (09/10/2026) : la requête n'attend plus le serveur SMTP. Relances espacées
            # (30 s, 2 min, 8 min) pour un serveur momentanément indisponible, puis file « failed »
            email:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_email'
                options:
                    dbindex: 1
                retry_strategy:
                    max_retries: 3
                    delay: 30000
                    multiplier: 4
                    max_delay: 0
            # Mémoires Vivantes (mise en page PDF complète d'un livre, Dompdf, lot 3 du 03/11/2026) : jamais relancé automatiquement,
            # le gestionnaire note lui-même l'échec dans mv_book.pdf_status / pdf_error et l'utilisateur relance depuis l'application
            pdf:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_pdf'
                options:
                    dbindex: 1
                retry_strategy:
                    max_retries: 0
            # Application de gestion (lecture de documents par IA, lot L1 du 10/11/2026) : worker dédié à la gestion, demandé par le
            # propriétaire pour ne rien mêler aux autres files ; jamais relancé, le gestionnaire note lui-même l'échec sur le document
            gestion_ai:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_gestion_ai'
                options:
                    dbindex: 1
                retry_strategy:
                    max_retries: 0
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%_failed'
                options:
                    dbindex: 1

        routing:
            'App\MemoiresVivantes\Message\GenerateChapterMessage': async
            'App\ESG\Message\GenerateEsgReportMessage': esg
            'App\Message\LandingAiJobMessage': landing_ai
            'App\Message\ProductAiBulkMessage': landing_ai # lots IA produits (fiches, traductions, images), même worker IA (07/11/2026)
            'App\Message\PrepareScrollVideoMessage': media
            'App\Import\Message\RunCatalogImportMessage': media # import de catalogue confirmé (lot IMP-1) : téléchargement des images compris
            'App\Import\Message\RunCustomerImportMessage': media # import de clients confirmé (lot IMP-2) : jamais relancé
            'App\Import\Message\RunOrderImportMessage': media # import de commandes confirmé, en archive à part (lot IMP-3) : jamais relancé
            'App\Import\Message\SendImportInvitationsMessage': media # invitations des clients repris (lot IMP-2) : une par invité, une seule fois
            'App\Services\Agency\Message\BuildAgencySiteMessage': media # création d'un site par une agence (lot AG-2) : une fabrication à la fois, jamais relancée
            'App\Services\Platform\Sites\Message\BuildPlatformSiteMessage': media # création d'un site avec son type par la plateforme (lot TYPE-1) : même verrou de fabrication, jamais relancée
            'App\Services\Agency\Message\ResendAgencySiteInvitationMessage': media # invitation de l'administrateur d'un site créé par une agence, renvoyée (lot AG-2)
            'App\Message\SendTenantEmailMessage': email
            'App\MemoiresVivantes\Message\GenerateBookPdfMessage': pdf
            'App\Gestion\Message\GenerateGestionReportMessage': pdf # rapports PDF de la gestion (lot DOC-1, 15/11/2026) : jamais relancé, l'échec est noté sur le rapport
            'App\Gestion\Message\ReadGestionDocumentMessage': gestion_ai # lecture de documents de la gestion (lot L1, 10/11/2026)
            'App\Gestion\Message\GenerateGestionAdviceMessage': gestion_ai # rédaction des conseils du guide de la gestion (lot G1a, 11/11/2026)
            'App\Gestion\Message\AnswerConsoleQuestionMessage': gestion_ai # réponses de la console IA de la gestion (lot W2, 13/11/2026)
            'App\LossPrevention\Message\WriteLossOpinionMessage': gestion_ai # avis de l'IA sur un constat de la prévention des pertes (lot L5-c, 17/11/2026)
            'App\LossPrevention\Message\CheckLossExitMessage': email # alerte de sortie de la prévention des pertes, deux minutes après la lecture (lot L5-d, 17/11/2026) : la file légère des notifications
            'App\Message\EntitlementChangedMessage': email # courriels des droits d'usage (console de pilotage, lot 3, 04/11/2026)
            'App\Message\CancelPlatformSubscriptionMessage': email # lot MOD-1 : « Retirer et résilier » ; même file que les avis des droits (la file async est celle de Mémoires Vivantes)

# Tests : Messenger en mémoire (tests/bootstrap.php) ; les courriels partent tout de suite (vers null://) pour que les
# tests lisent les messages envoyés
when@test:
    framework:
        messenger:
            transports:
                email: 'sync://'
