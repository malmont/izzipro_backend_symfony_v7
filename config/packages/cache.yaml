framework:
    cache:
        prefix_seed: 'v7_ecommerce'
        app: cache.adapter.redis_tag_aware
        default_redis_provider: '%env(REDIS_URL)%'
        pools:
            # Limiteur de débit (connexion, OTP, PIN de la caisse, formulaires…) : son propre pool, hors du cache applicatif à
            # étiquettes (28/10/2026). Sans REDIS_LIMITER_URL, même instance que le cache (repli sur REDIS_URL) ; en production
            # avec une instance de cache à éviction, pointer REDIS_LIMITER_URL vers une instance sans éviction (sessions, files).
            cache.rate_limiter:
                adapter: cache.adapter.redis
                provider: '%env(default:env_redis_url:REDIS_LIMITER_URL)%'
       