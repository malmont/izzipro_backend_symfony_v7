# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    router:
            strict_requirements: true
    secret: '%env(APP_SECRET)%'
    # Requêtes reçues via Nginx Proxy Manager puis nginx : sans cela, getClientIp() renvoie l'IP du proxy
    # (limites de débit et journaux faussés). Seul X-Forwarded-For est pris en compte, pas l'hôte (détection du tenant inchangée).
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for']
    csrf_protection: true
    http_method_override: false

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        name: 'V7SESSID'
        handler_id: '%env(REDIS_URL)%'
        cookie_secure: true
        cookie_httponly: true
        # Lax : cookie non envoyé aux requêtes intersites en arrière-plan (fetch, iframe, POST) → protection CSRF de base.
        # Vérifié le 26/09/2026 : seuls les domaines *.backend-strapi.online utilisent la session, les fronts passent par /api (JWT).
        cookie_samesite: lax
        gc_maxlifetime: 3600

    #esi: true
    #fragments: true
    php_errors:
        log: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
