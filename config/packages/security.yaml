security:
    
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        tenant_user_provider:
            id: App\Security\TenantUserProvider
    firewalls:



        api:
            pattern:   ^/api(?!/(login|logout|health|currencies|tenant/check|order/create-guest|stripe-config|stripe/create-intent|stripe/webhook|webhooks|adresses/autocomplete|adresses/details|transporteurs|Carrier|shipping/rates|shipping/summary|contact/submit|team|vehicles|vehicle_products|vehicle-products|financement|shared-media))
            stateless: true
            provider:  tenant_user_provider
            jwt: ~


        dev:
            pattern:   ^/(_(profiler|wdt)|css|images|js)/
            security:  false

        main:
            pattern:                ^/             # prend tout le reste
            stateless:              false          # si vous utilisez des sessions
            provider:               tenant_user_provider  # ← impératif !
            custom_authenticator:   App\Security\LoginAuthenticator
            logout:
                path: app_logout
            user_checker:           App\Security\UserChecker
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
                lock_factory: null
        



    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # 🔹 Déconnexion : doit fonctionner même avec un jeton expiré (sinon 401 et cookies conservés,
        #    puis reconnexion automatique par le cookie de rafraîchissement). Hors pare-feu JWT (voir firewalls.api).
        - { path: ^/api/logout$, roles: PUBLIC_ACCESS }

        # 🔹 Webhooks Stripe
        - { path: ^/api/stripe/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/stripe/webhook, roles: PUBLIC_ACCESS }

        # 🔹 Webhooks externes (Lulu Print API, etc.)
        - { path: ^/api/webhooks/, roles: PUBLIC_ACCESS }

        # 🔹 Administration Mémoires Vivantes (Gestion des utilisateurs, etc.)
        - { path: ^/api/memoires/admin/, roles: ROLE_ADMIN }

        # 🔹 Partage public des questionnaires Mémoires Vivantes (UUID fait office de token)
        # 🔹 Mémoires Vivantes : impression (devis, paiement, commandes), génération des PDF et lien de paiement réservés
        #    aux utilisateurs connectés (propriétaire du livre ou admin, vérifié par BookAccessGuard). Publics avant le 29/09/2026.
        - { path: ^/api/memoires/(books/[^/]+/)?print/, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/memoires/books/[^/]+/(pdf/generate|payment-link|send-payment-link)$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/memoires/, roles: PUBLIC_ACCESS }

        # 🔹 Réservations publiques (prise de rendez-vous et prestations)
        - { path: ^/api/reservations, roles: PUBLIC_ACCESS }

        # 🔹 ROLE_USER_INTERNET peut lire (GET)
        - { path: ^/api/admin-settings, methods: [GET], roles: PUBLIC_ACCESS }
        # 🔹 ROLE_ADMIN peut modifier (POST, PUT, DELETE)
        - { path: ^/api/admin-settings, methods: [POST, PUT, DELETE], roles: ROLE_ADMIN }

        # 🔹 Écran des workers (communs à tous les sites) : propriétaire de la plateforme. Ouvert depuis le menu, il passe
        #    par /admin?routeName=… : le contrôleur (WorkerAdminController) exige aussi ce rôle.
        - { path: ^/admin/workers, roles: ROLE_SUPER_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/(account|adress|checkout), roles: [ROLE_USER_INTERNET, ROLE_USER_POS,ROLE_ADMIN] }
        - { path: ^/api/boussole/auth/(register|login), roles: PUBLIC_ACCESS }
        - { path: ^/api/boussole/referentials, roles: PUBLIC_ACCESS }
        - { path: ^/api/boussole/documents, roles: ROLE_COMPANY }
        - { path: ^/api/boussole, roles: [ROLE_COMPANY, ROLE_CONSULTANT, ROLE_USER, ROLE_ADMIN] }
        # 🔹 Assistant IA des landing pages : administrateurs du tenant uniquement.
        #    Placé avant la règle publique ci-dessous, dont le motif « landingpage » couvrirait aussi /api/landingpage-ai.
        - { path: ^/api/landingpage-ai(/|$), roles: ROLE_ADMIN }
        # 🔹 Bibliothèque de modèles de site (lecture comprise) : administrateurs du tenant. Avant la règle publique « landingpage ».
        - { path: ^/api/landingpage-site-models(/|$), roles: ROLE_ADMIN }
        # 🔹 Synchronisation de la configuration des landing pages : ROLE_SUPER_ADMIN ou jeton de déploiement
        #    (X-Deploy-Token), vérifiés par LandingConfigController. Avant la règle publique « landingpage ».
        - { path: ^/api/landingpage-config(/|$), roles: PUBLIC_ACCESS }
        # 🔹 Données personnelles (messages de contact, candidatures) : réservées aux admins.
        #    Le dépôt via les formulaires publics (POST) reste ouvert. Avant le 26/09/2026, la liste était lisible par tous.
        - { path: ^/api/(contacts|candidatures)(/|$), methods: [GET, PUT, PATCH, DELETE], roles: ROLE_ADMIN }
        # 🔹 Contenus des sites (landing pages, boutique) : lecture publique, écriture réservée aux admins.
        #    Avant le 26/09/2026, n'importe qui pouvait les créer, modifier ou supprimer sans être connecté.
        #    landingpage-settings / entreprise : l'éditeur des landing pages doit être utilisé connecté en admin (cookie JWT + X-XSRF-TOKEN).
        # 🔹 VideoApiController répond aussi sous /videos (sans /api, hors pare-feu JWT) : jusqu'au 29/09/2026, n'importe qui
        #    pouvait y créer, modifier ou supprimer les vidéos d'un site. Écritures fermées (lecture publique inchangée).
        - { path: ^/videos(/|$), methods: [POST, PUT, PATCH, DELETE], roles: ROLE_ADMIN }
        - { path: ^/api/(bannieres|emplois|marques|categories-marque|multiliens|recherches|service-offers|videos|team|products|transporteurs|vehicles|vehicle_products|vehicle-products|homeslider|features|explore-cards|components-config|embeds|baniere-statiques|presentations|presentation-groups|category|customization|currencies|landingpage-settings|entreprise|shared-media|media)(/|\.|$), methods: [POST, PUT, PATCH, DELETE], roles: ROLE_ADMIN }

        - { path: ^/api/(login|health|currencies|customization|register|login-web|token/refresh|password-reset/request|password-reset/confirm|password-reset/form|products/by-category|category|homeslider|products|entreprise|otp-verify|features|explore-cards|bannieres|emplois|candidatures|marques|categories-marque|multiliens|recherches|service-offers|videos|contacts|components-config|landingpage-settings|embeds|baniere-statiques|presentations|landingpage|presentation-groups|tenant/check|newsletter/subscribe|booking|resend-verification|order/create-guest|stripe-config|stripe/create-intent|adresses/autocomplete|adresses/details|transporteurs|Carrier|shipping/rates|shipping/summary|contact/submit|team|vehicles|vehicle_products|vehicle-products|financement|shared-media), roles: PUBLIC_ACCESS }
        - { path: ^/api/(collections|createcollections|commandes|fournisseurs|transporteurs|dashboard|caisse|statistiques|stock-evolution|stock-value|frais|payments/statistics|taxes/monthly|carrier/statistics), roles: ROLE_ADMIN }
        # 🔹 Encaissement multi-paiements (espèces, carte...) : réservé à la caisse et aux admins, pas aux clients en ligne
        - { path: ^/api/order/create-multi-payment, roles: [ROLE_USER_POS, ROLE_ADMIN] }
        - { path: ^/api, roles: [ROLE_USER_INTERNET, ROLE_USER_POS,ROLE_ADMIN] }

        



when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
