# Limitation de débit des routes publiques sensibles (appliquée par App\EventSubscriber\PublicEndpointRateLimitSubscriber).
# Stockage : pool `cache.rate_limiter` (config/packages/cache.yaml : Redis, REDIS_LIMITER_URL ou REDIS_URL), distinct du
# cache applicatif à étiquettes depuis le 28/10/2026. lock_factory: null car le composant Lock n'est pas configuré (comme login_throttling).
framework:
    rate_limiter:
        # Connexion par l'API : essais de mots de passe à la chaîne. Clés (01/11/2026) : par site et compte, par site et IP,
        # puis plafond global par IP seule (un excès sur une boutique derrière une IP partagée, NAT d'opérateur mobile, ne bloque
        # plus les clients des autres boutiques ; une IP qui vise toutes les boutiques reste bornée par le plafond global).
        api_login_account:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
            lock_factory: null
        # par site + IP
        api_login_ip:
            policy: sliding_window
            limit: 50
            interval: '15 minutes'
            lock_factory: null
        # plafond global, IP seule, toutes boutiques confondues
        api_login_global_ip:
            policy: sliding_window
            limit: 200
            interval: '15 minutes'
            lock_factory: null
        # Code OTP à 6 chiffres valable 5 minutes : sans limite, il peut être deviné
        otp_verify_account:
            policy: fixed_window
            limit: 5
            interval: '10 minutes'
            lock_factory: null
        # Changement d'adresse courriel du compte (PATCH /api/profile, S7) : essais de mot de passe ou de code, comme la connexion
        profile_email_change_account:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
            lock_factory: null
        # Suppression du compte (DELETE /api/account, 01/11/2026) : essais de mot de passe ou de code, par compte
        account_delete_account:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
            lock_factory: null
        # Mot de passe oublié : évite d'inonder une boîte mail. Même schéma que la connexion : par site et compte, par site et IP,
        # plafond global par IP (01/11/2026)
        password_reset_account:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
            lock_factory: null
        # par site + IP
        password_reset_ip:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
            lock_factory: null
        # plafond global, IP seule
        password_reset_global_ip:
            policy: sliding_window
            limit: 60
            interval: '1 hour'
            lock_factory: null
        # Renvoi du lien de vérification (B16, 04/11/2026) : même schéma que le mot de passe oublié ; plafond global partagé
        resend_verification_account:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
            lock_factory: null
        resend_verification_ip:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
            lock_factory: null
        # Formulaires publics (contact, newsletter, candidature, inscription, réservation...) : anti-spam, par site + IP (01/11/2026 :
        # code du site résolu, et non plus l'hôte du backend, commun à toutes les boutiques).
        # public_form_ip compte les envois ACCEPTÉS (réponse 2xx) : un refus 422 corrigé par le visiteur ne compte pas.
        public_form_ip:
            policy: sliding_window
            limit: 10
            interval: '10 minutes'
            lock_factory: null
        # Toutes les tentatives (refus compris) : borne les envois en rafale
        public_form_attempts_ip:
            policy: sliding_window
            limit: 60
            interval: '10 minutes'
            lock_factory: null
        # Plafond global des envois acceptés, IP seule, toutes boutiques confondues : ces formulaires envoient des courriels, une
        # même IP ne peut pas en faire partir 10 par boutique sur toutes les boutiques
        public_form_global_ip:
            policy: sliding_window
            limit: 30
            interval: '10 minutes'
            lock_factory: null
        # Choix du site par code court dans l'application mobile (31/10/2026) : seule la recherche par code court est
        # limitée (20 essais par minute et par IP, 429 + Retry-After) ; la recherche exacte reste sans limite (IP partagées).
        # Même limite en test : le 429 se prouve par TenantShortCodeTest, jamais sur la production.
        tenant_short_code_ip:
            policy: sliding_window
            limit: 20
            interval: '1 minute'
            lock_factory: null

        # Assistant IA des landing pages : 5 demandes par minute et par tenant
        landing_ai_tenant:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
            lock_factory: null

        # Activation d'une application mobile par clé (15/10/2026) : essais de clés par IP
        app_activation_ip:
            policy: sliding_window
            limit: 20
            interval: '15 minutes'
            lock_factory: null

        # Connexion par PIN depuis un terminal de caisse (20/10/2026) : en plus du blocage par compte
        pos_pin_login:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
            lock_factory: null

        # Validations d'un responsable (30/10/2026, S2) : essais par terminal, en plus du blocage du PIN par compte
        pos_approval_terminal:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
            lock_factory: null
        # Jetons de connexion du kit Stripe Terminal (F13/F16) : le kit en redemande à chaque reconnexion, jamais en boucle
        pos_connection_token_terminal:
            policy: sliding_window
            limit: 60
            interval: '10 minutes'
            lock_factory: null

        # Consultation du solde d'une carte-cadeau ou d'un avoir (27/10/2026, F9) : anti-balayage des codes, par terminal et par IP
        pos_gift_card_lookup_terminal:
            policy: sliding_window
            limit: 20
            interval: '10 minutes'
            lock_factory: null
        pos_gift_card_lookup_ip:
            policy: sliding_window
            limit: 60
            interval: '10 minutes'
            lock_factory: null

        # Avis clients : dépôts par client connecté (09/10/2026)
        review_submit:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
            lock_factory: null

        # Synchronisation de la configuration des landing pages : essais de jeton de déploiement invalides par IP
        landing_config_token:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
            lock_factory: null

# Tests : toutes les connexions viennent de la même IP ; la suite dépasse 50 connexions en 15 minutes.
# La limite de production reste celle ci-dessus.
when@test:
    framework:
        rate_limiter:
            api_login_ip:
                policy: sliding_window
                limit: 10000
                interval: '15 minutes'
                lock_factory: null
            api_login_global_ip:
                policy: sliding_window
                limit: 10000
                interval: '15 minutes'
                lock_factory: null
            # Plafond global de la réinitialisation abaissé à 30 pour le prouver dans RateLimitPerSiteTest (par site : 20, comme en
            # production) ; les formulaires publics viennent tous de la même IP dans la suite : plafond global relevé
            password_reset_global_ip:
                policy: sliding_window
                limit: 30
                interval: '1 hour'
                lock_factory: null
            public_form_global_ip:
                policy: sliding_window
                limit: 10000
                interval: '10 minutes'
                lock_factory: null
            # Validations (S2) : la suite enchaîne les validations sur peu de terminaux ; la limite est testée à part
            pos_approval_terminal:
                policy: sliding_window
                limit: 10000
                interval: '15 minutes'
                lock_factory: null
            # Consultation des cartes-cadeaux (F9) : la suite consulte depuis la même IP ; la limite par terminal reste celle de production (testée)
            pos_gift_card_lookup_ip:
                policy: sliding_window
                limit: 10000
                interval: '10 minutes'
                lock_factory: null
            # Activation des applications : toute la suite part de la même IP (tests seulement, 19/10/2026)
            app_activation_ip:
                policy: sliding_window
                limit: 10000
                interval: '15 minutes'
                lock_factory: null
            pos_pin_login:
                policy: sliding_window
                limit: 10000
                interval: '15 minutes'
                lock_factory: null
            # Jetons de connexion (F13/F16) : limite basse pour la tester
            pos_connection_token_terminal:
                policy: sliding_window
                limit: 4
                interval: '10 minutes'
                lock_factory: null
