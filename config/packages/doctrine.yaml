doctrine:
    dbal:
        # ON COMMENTE OU ON SUPPRIME LA LIGNE 'url'
        url: '%env(resolve:DATABASE_URL)%'

        # ON LA REMPLACE PAR LES PARAMÈTRES EXPLICITES
        # driver: 'pdo_pgsql' # Pour PostgreSQL. Mettez 'pdo_mysql' pour MySQL.
        # host: '127.0.0.1'   # Ou le nom de votre service Docker (ex: 'database')
        # port: 5432
        # dbname: 'ecommerceflutter' # Le nom de votre base par défaut
        # user: 'postgres'         # Votre utilisateur de base de données
        # password: 'Wipit2017'   # Votre mot de passe
        # server_version: '14'      # La version de votre serveur PostgreSQL
        # charset: UTF8
        
        


        
    

        
        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '15'
    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
