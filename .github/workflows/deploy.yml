name: Build and Deploy Docker Image to GHCR and Server

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        client: [CLIENT1]  # Déploiement multi-serveurs

    steps:
      # 🔑 1️⃣ Configuration de la clé SSH
      - name: 🔑 Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 -H ${{ secrets.CLIENT1_SERVER_IP }} >> ~/.ssh/known_hosts
          echo "✅ Clé SSH configurée."

      # 📥 2️⃣ Checkout complet du repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🛠️ Create app and public directories on server
        run: |
          echo "📂 Création des dossiers app et public si nécessaire..."
          
          # Création du dossier app
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} \
            "mkdir -p /home/${{ secrets.CLIENT1_SERVER_USER }}/app && \
              chown -R ${{ secrets.CLIENT1_SERVER_USER }}:${{ secrets.CLIENT1_SERVER_USER }} /home/${{ secrets.CLIENT1_SERVER_USER }}/app && \
              chmod -R 755 /home/${{ secrets.CLIENT1_SERVER_USER }}/app"
              
          # Création du dossier public
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} \
            "mkdir -p /home/${{ secrets.CLIENT1_SERVER_USER }}/app/public && \
              chown -R ${{ secrets.CLIENT1_SERVER_USER }}:${{ secrets.CLIENT1_SERVER_USER }} /home/${{ secrets.CLIENT1_SERVER_USER }}/app/public && \
              chmod -R 755 /home/${{ secrets.CLIENT1_SERVER_USER }}/app/public"
      
          echo "✅ Dossiers app et public prêts avec les bonnes permissions."
        

      # 🔄 3️⃣ Générer le fichier .env avec Messenger DSN
      - name: 🔄 Générer le fichier .env localement
        run: |
          echo "📄 Génération du fichier .env..."
          cat <<EOL > .env
          POSTGRES_USER=${{ secrets.DB_USER }}
          POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
          POSTGRES_DB=${{ secrets.DB_NAME }}
          POSTGRES_HOST=${{ secrets.DB_HOST }}
          POSTGRES_PORT=${{ secrets.DB_PORT }}
          APP_ENV=prod
          APP_SECRET=${{ secrets.APP_SECRET }}
          DATABASE_URL=pgsql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}
          
          ###> symfony/messenger ###
          MESSENGER_TRANSPORT_DSN=doctrine://default
          ###< symfony/messenger ###
          EOL
          echo "✅ Fichier .env généré."

      # 🔄 Synchronisation des fichiers avec rsync (y compris le .env et le dossier public)
      - name: 🔄 Synchroniser les fichiers avec rsync
        run: |
          echo "📤 Synchronisation des fichiers avec rsync..."
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            .env \
            Dockerfile \
            docker-compose.yml \
            docker-entrypoint.sh \
            generate-env.sh \
            docker/ \
            public/ \   # <-- ✅ Ajout du dossier public
            ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }}:/home/${{ secrets.CLIENT1_SERVER_USER }}/app/
          echo "✅ Synchronisation terminée."


      # 🔑 5️⃣ Connexion à GHCR
      - name: 🔑 Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

        # 🏗️ Construction de l'image Docker 
      - name: 🏗️ Build Docker Image with Tags
        run: |
          echo "📦 Démarrage du build Docker"
          docker build --build-arg APP_ENV=prod -t ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }} ./
          docker tag ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }} ghcr.io/${{ github.repository_owner }}/symfony-backend:latest
          echo "✅ Build Docker terminé"

      # 📦 Push de l'image Docker
      - name: 📦 Push Docker Image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }}
          docker push ghcr.io/${{ github.repository_owner }}/symfony-backend:latest
          echo "✅ Image Docker poussée vers GHCR"


      # 🚀 8️⃣ Déploiement sans rebuild
      - name: 🚀 Déployer les conteneurs
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} << 'EOF'
            cd /home/${{ secrets.CLIENT1_SERVER_USER }}/app/

            echo "📥 Pull de la dernière image..."
            docker-compose pull  # ✅ Pull sans rebuild

            echo "🚀 Lancement des conteneurs..."
            docker-compose up -d  # ✅ PAS de --build

            echo "✅ Déploiement terminé."
          EOF

      # 🛠️ Fixer les permissions des dossiers Symfony
      - name: 🛠️ Fixer les permissions des dossiers Symfony
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} << 'EOF'
            docker exec symfony_app mkdir -p /var/www/var/cache /var/www/var/log
            docker exec symfony_app chown -R www-data:www-data /var/www/var
            docker exec symfony_app chmod -R 775 /var/www/var
          EOF

      # ⚙️ 9️⃣ Commandes Symfony post-déploiement
      - name: ⚙️ Exécuter les commandes Symfony
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} << 'EOF'
            docker exec symfony_app php bin/console cache:clear
            docker exec symfony_app php bin/console doctrine:migrations:migrate --no-interaction
          EOF
