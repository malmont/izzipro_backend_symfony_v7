name: Build and Deploy Docker Image to GHCR and Server

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        client: [CLIENT1]  # Déploiement multi-serveurs

    steps:
      # 🔑 1️⃣ Configuration de la clé SSH
      - name: 🔑 Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 -H ${{ secrets.CLIENT1_SERVER_IP }} >> ~/.ssh/known_hosts
          echo "✅ Clé SSH configurée."

      # 📥 2️⃣ Checkout complet du repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 🔄 3️⃣ Générer le fichier .env
      - name: 🔄 Générer le fichier .env localement
        run: |
          echo "📄 Génération du fichier .env..."
          cat <<EOL > .env
          POSTGRES_USER=${{ secrets.DB_USER }}
          POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
          POSTGRES_DB=${{ secrets.DB_NAME }}
          POSTGRES_HOST=${{ secrets.DB_HOST }}
          POSTGRES_PORT=${{ secrets.DB_PORT }}
          APP_ENV=prod
          APP_SECRET=${{ secrets.APP_SECRET }}
          DATABASE_URL=pgsql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}
          EOL
          echo "✅ Fichier .env généré."

      # 🔄 4️⃣ Synchronisation des fichiers nécessaires (.env et docker-compose.yml)
      - name: 🔄 Synchroniser les fichiers nécessaires
        run: |
          echo "📤 Synchronisation des fichiers..."
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            .env \
            docker-compose.yml \
            ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }}:/home/${{ secrets.CLIENT1_SERVER_USER }}/app/
          echo "✅ Synchronisation terminée."

      # 🔑 5️⃣ Connexion à GHCR
      - name: 🔑 Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 🏗️ 6️⃣ Construction de l'image Docker (uniquement sur GitHub Actions)
      - name: 🏗️ Build Docker Image
        run: |
          echo "📦 Construction de l'image Docker..."
          docker build -t ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }} .
          docker tag ghcr.io/${{ github.repository_owner }}/symfony-backend:latest
          echo "✅ Construction terminée."

      # 📦 7️⃣ Push de l'image Docker vers GHCR
      - name: 📦 Push Docker Image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }}
          docker push ghcr.io/${{ github.repository_owner }}/symfony-backend:latest
          echo "✅ Image Docker poussée vers GHCR."

      # 🚀 8️⃣ Déploiement sans rebuild
      - name: 🚀 Déployer les conteneurs
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} << 'EOF'
            cd /home/${{ secrets.CLIENT1_SERVER_USER }}/app/

            echo "📥 Pull de la dernière image..."
            docker-compose pull  # ✅ Pull sans rebuild

            echo "🚀 Lancement des conteneurs..."
            docker-compose up -d  # ✅ PAS de --build

            echo "✅ Déploiement terminé."
          EOF

      # ⚙️ 9️⃣ Commandes Symfony post-déploiement
      - name: ⚙️ Exécuter les commandes Symfony
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} << 'EOF'
            docker exec symfony_app php bin/console cache:clear
            docker exec symfony_app php bin/console doctrine:migrations:migrate --no-interaction
          EOF
