name: Build and Deploy Docker Image to GHCR and Servers

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        client: [CLIENT1]  # Déploiement multi-serveurs

    steps:
      # 📥 Récupération du code
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      # 🔑 Connexion à GHCR
      - name: 🔑 Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 🏗️ Construction de l'image Docker avec les tags
      - name: 🏗️ Build Docker Image with Tags
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }} .
          docker tag ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }} ghcr.io/${{ github.repository_owner }}/symfony-backend:latest

      # 📦 Push de l'image Docker sur GHCR avec les tags
      - name: 📦 Push Docker Image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }}
          docker push ghcr.io/${{ github.repository_owner }}/symfony-backend:latest

      # 🛠️ Création du dossier de déploiement avec permissions
      - name: 🛠️ Create app directory on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.CLIENT1_SERVER_IP }}
          username: ${{ secrets.CLIENT1_SERVER_USER }}
          password: ${{ secrets.CLIENT1_SERVER_PASSWORD }}
          script: |
            echo "📂 Création du dossier app si nécessaire..."
            sudo mkdir -p /home/${{ secrets.CLIENT1_SERVER_USER }}/app
            echo "🔒 Attribution des droits au dossier..."
            sudo chown -R $USER:$USER /home/${{ secrets.CLIENT1_SERVER_USER }}/app
            sudo chmod -R 755 /home/${{ secrets.CLIENT1_SERVER_USER }}/app
            echo "✅ Dossier prêt avec les bonnes permissions."

      # 📦 Compression et transfert des fichiers (optimisé)
      - name: 📤 Compress and Copy Project Files to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.CLIENT1_SERVER_IP }}
          username: ${{ secrets.CLIENT1_SERVER_USER }}
          password: ${{ secrets.CLIENT1_SERVER_PASSWORD }}
          script: |
            echo "📦 Compression des fichiers..."
            tar -czf project-files.tar.gz Dockerfile docker-compose.yml generate-env.sh docker-entrypoint.sh docker/

            echo "📤 Transfert des fichiers vers le serveur..."
            scp -P 22 project-files.tar.gz ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }}:/home/${{ secrets.CLIENT1_SERVER_USER }}/app/

            echo "📂 Décompression de l'archive dans le dossier app..."
            ssh ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} "
              cd /home/${{ secrets.CLIENT1_SERVER_USER }}/app/ && \
              tar -xzf project-files.tar.gz && \
              rm project-files.tar.gz && \
              echo '✅ Fichiers décompressés dans /app.'
            "

            echo "✅ Transfert et décompression terminés."

      # 🚀 Déploiement des conteneurs
      - name: 🚀 Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.CLIENT1_SERVER_IP }}
          username: ${{ secrets.CLIENT1_SERVER_USER }}
          password: ${{ secrets.CLIENT1_SERVER_PASSWORD }}
          script: |
            echo "📂 Déplacement dans le dossier de déploiement..."
            cd /home/${{ secrets.CLIENT1_SERVER_USER }}/app/

            echo "🔄 Pull de l'image Docker depuis GHCR..."
            docker pull ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }}
            docker pull ghcr.io/${{ github.repository_owner }}/symfony-backend:latest

            echo "🧹 Nettoyage des anciens conteneurs..."
            docker-compose down || true

            echo "🚀 Lancement des conteneurs avec Docker Compose..."
            docker-compose up -d --build

            echo "⏳ Attente de la disponibilité des services..."
            sleep 20  # Temps d'attente pour laisser PostgreSQL démarrer

            echo "⚙️ Attribution des permissions d'exécution aux scripts..."
            chmod +x /home/${{ secrets.CLIENT1_SERVER_USER }}/app/docker-entrypoint.sh

            echo "⚙️ Exécution du script d'initialisation dans le conteneur Symfony..."
            docker exec symfony_app bash /home/app/docker-entrypoint.sh

            echo "✅ Déploiement terminé."
