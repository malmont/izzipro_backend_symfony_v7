name: Build and Deploy Docker Image to GHCR and Servers

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        client: [CLIENT1]  # Déploiement multi-serveurs

    steps:
      # 📥 Récupération du code
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      # 🔑 Connexion à GHCR
      - name: 🔑 Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 🏗️ Construction de l'image Docker avec les tags
      - name: 🏗️ Build Docker Image with Tags
        run: |
          # 🔨 Build de l'image avec le tag spécifique au client
          docker build -t ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }} .
          
          # 🔖 Tag de l'image en 'latest'
          docker tag ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }} ghcr.io/${{ github.repository_owner }}/symfony-backend:latest

      # 📦 Push de l'image Docker sur GHCR avec les tags
      - name: 📦 Push Docker Image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }}
          docker push ghcr.io/${{ github.repository_owner }}/symfony-backend:latest

      # 🚀 Déploiement sur les serveurs
      - name: 🚀 Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.CLIENT1_SERVER_IP }}
          username: ${{ secrets.CLIENT1_SERVER_USER }}
          password: ${{ secrets.CLIENT1_SERVER_PASSWORD }}
          script: |
            echo "🔄 Pull de l'image Docker depuis GHCR..."
            
            # ✅ Pull de l'image avec le tag spécifique au client
            docker pull ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }}
            
            # ✅ Pull de l'image avec le tag latest (sécurité)
            docker pull ghcr.io/${{ github.repository_owner }}/symfony-backend:latest

            echo "🧹 Nettoyage des anciens conteneurs..."
            docker stop symfony_app || true
            docker rm symfony_app || true

            echo "🚀 Lancement du conteneur Symfony..."
            docker run -d --name symfony_app \
              -p 80:80 \
              ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }}

            echo "✅ Déploiement terminé."
