name: Build and Deploy Docker Image to GHCR and Servers

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        client: [CLIENT1]  # Déploiement multi-serveurs

    steps:
      # 📥 Récupération du code
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      # 🔑 Connexion à GHCR
      - name: 🔑 Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 🏗️ Construction de l'image Docker avec les tags
      - name: 🏗️ Build Docker Image with Tags
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }} .
          docker tag ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }} ghcr.io/${{ github.repository_owner }}/symfony-backend:latest

      # 📦 Push de l'image Docker sur GHCR avec les tags
      - name: 📦 Push Docker Image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }}
          docker push ghcr.io/${{ github.repository_owner }}/symfony-backend:latest

      # 🔑 Configuration correcte de la clé SSH ED25519
      - name: 🔑 Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 -H ${{ secrets.CLIENT1_SERVER_IP }} >> ~/.ssh/known_hosts
          echo "✅ Clé SSH ED25519 configurée."

      # 🛠️ Création du dossier de déploiement avec permissions
      - name: 🛠️ Create app directory on server
        run: |
          echo "📂 Création du dossier app si nécessaire..."
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} \
            "mkdir -p /home/${{ secrets.CLIENT1_SERVER_USER }}/app && chown -R ${{
            secrets.CLIENT1_SERVER_USER }}:${{ secrets.CLIENT1_SERVER_USER }} /home/${{
            secrets.CLIENT1_SERVER_USER }}/app && chmod -R 755 /home/${{ secrets.CLIENT1_SERVER_USER }}/app"
          echo "✅ Dossier prêt avec les bonnes permissions."



      # 🔄 Synchronisation des fichiers avec rsync
      - name: 🔄 Synchroniser les fichiers avec rsync
        run: |
          echo "📤 Synchronisation des fichiers avec rsync..."
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            Dockerfile \
            docker-compose.yml \
            generate-env.sh \
            docker-entrypoint.sh \
            docker/ \
            ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }}:/home/${{ secrets.CLIENT1_SERVER_USER }}/app/
          echo "✅ Synchronisation terminée."


          # 🔄 Génération du fichier .env
      - name: 🔄 Générer le fichier .env sur le serveur
        run: |
          echo "🔄 Attribution des droits d'exécution au script generate-env.sh..."
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} \
            "chmod +x /home/${{ secrets.CLIENT1_SERVER_USER }}/app/generate-env.sh"
            
          echo "🔄 Génération du fichier .env..."
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} \
            "cd /home/${{ secrets.CLIENT1_SERVER_USER }}/app && bash generate-env.sh"
          echo "✅ Fichier .env généré.

      # 🚀 Déploiement des conteneurs
      - name: 🚀 Deploy to Server
        run: |
          echo "📂 Déploiement sur le serveur..."
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} << 'EOF'
            cd /home/${{ secrets.CLIENT1_SERVER_USER }}/app/
            
            echo "🔄 Pull de l'image Docker depuis GHCR..."
            docker pull ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }}
            
            echo "🧹 Nettoyage des anciens conteneurs..."
            docker-compose down || true

            echo "🚀 Lancement des conteneurs avec Docker Compose..."
            docker-compose up -d --build

            echo "⏳ Attente de la disponibilité des services..."
            sleep 20  # Laisse PostgreSQL démarrer

            echo "⚙️ Attribution des permissions d'exécution au script d'initialisation..."
            chmod +x /home/${{ secrets.CLIENT1_SERVER_USER }}/app/docker-entrypoint.sh

            echo "⚙️ Exécution du script d'initialisation dans le conteneur Symfony..."
            docker exec symfony_app bash /home/app/docker-entrypoint.sh

            echo "✅ Déploiement terminé."
          EOF
