# deploy.yml

# Nom du workflow qui apparaît dans l'interface de GitHub Actions
name: Build and Deploy (Self-Hosted QA)

# Déclencheur du workflow : s'exécute à chaque push sur la branche "qa"
on:
  push:
    branches:
      - qa

# La clé "jobs" contient tous les travaux à exécuter
jobs:
  # ===================================================================
  # JOB POUR RUNNER SELF-HOSTED (CORRIGÉ)
  # ===================================================================
  build-and-deploy-self-hosted:
    name: Build and Deploy (Self-Hosted)
    permissions:
      contents: read
      packages: write
    runs-on: self-hosted 

    env:
      APP_PATH: /home/${{ secrets.CLIENT1_SERVER_USER }}/app

    defaults:
      run:
        working-directory: ${{ env.APP_PATH }}

    steps:
      # 🔑 1️⃣ Configuration de la clé SSH pour cloner le dépôt
      - name: 🔑 Configure SSH for Git Checkout
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 📥 2️⃣ Checkout du repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # 🛠️ 3️⃣ Création des dossiers nécessaires (si absents)
      - name: 🛠️ Create required directories
        run: |
          echo "📂 Création des dossiers app, public, et jwt si nécessaire..."
          sudo mkdir -p ${{ env.APP_PATH }}/public
          sudo mkdir -p ${{ env.APP_PATH }}/jwt
          sudo chown -R ${{ secrets.CLIENT1_SERVER_USER }}:${{ secrets.CLIENT1_SERVER_USER }} ${{ env.APP_PATH }}
          echo "✅ Dossiers vérifiés."

      # 🔄 4️⃣ Générer le fichier .env
      - name: 🔄 Generate .env file
        run: |
          echo "📄 Génération du fichier .env..."
          cat <<EOL > .env
          POSTGRES_USER=${{ secrets.DB_USER }}
          POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
          POSTGRES_DB=${{ secrets.DB_NAME }}
          POSTGRES_HOST=${{ secrets.DB_HOST }}
          POSTGRES_PORT=${{ secrets.DB_PORT }}
          APP_ENV=prod
          APP_SECRET=${{ secrets.APP_SECRET }}
          DATABASE_URL=pgsql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}
          REDIS_URL=redis://redis
          MAILER_DSN=${{ secrets.MAILER_DSN }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          JWT_PUBLIC_KEY=${{ secrets.JWT_PUBLIC_KEY }}
          JWT_PASSPHRASE=${{ secrets.JWT_PASSPHRASE }}
          SQUARE_SECRET_KEY=${{ secrets.SQUARE_SECRET_KEY }}
          CLIENT1_SERVER_USER=${{ secrets.CLIENT1_SERVER_USER }}
          CLIENT1_GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
          EOL
          echo "✅ Fichier .env généré."

      # 🔑 5️⃣ Générer les clés JWT (si absentes)
      - name: 🔑 Generate JWT Keys if not present
        run: |
          JWT_DIR="jwt"
          if [ ! -f "$JWT_DIR/private.pem" ]; then
            echo "🔑 Génération des clés JWT..."
            sudo openssl genrsa -out "$JWT_DIR/private.pem" 2048
            sudo openssl rsa -pubout -in "$JWT_DIR/private.pem" -out "$JWT_DIR/public.pem"
            sudo chmod 600 "$JWT_DIR/private.pem" "$JWT_DIR/public.pem"
            sudo chown -R www-data:www-data "$JWT_DIR"
            sudo chmod -R 750 "$JWT_DIR"
            echo "✅ Clés JWT générées."
          else
            echo "✅ Clés JWT déjà présentes."
          fi

      # 🔑 6️⃣ Connexion à GHCR avec le GITHUB_TOKEN
      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🏗️ 7️⃣ Construire et Pousser les images Docker
      - name: 🏗️ Build and Push Docker Images
        run: |
          echo "📦 Construction et push de l'image Symfony..."
          docker build --build-arg APP_ENV=prod -t ghcr.io/${{ github.repository_owner }}/symfony-backend:latest -f Dockerfile .
          docker push ghcr.io/${{ github.repository_owner }}/symfony-backend:latest
          
          echo "📦 Construction et push de l'image Nginx..."
          docker build -t ghcr.io/${{ github.repository_owner }}/symfony-nginx:latest -f Dockerfile.nginx .
          docker push ghcr.io/${{ github.repository_owner }}/symfony-nginx:latest
          
          echo "✅ Images Docker poussées vers GHCR."

      # 🚀 8️⃣ Déployer les conteneurs avec Docker Compose
      - name: 🚀 Deploy containers
        run: |
          echo "🔧 Configuration du kernel: vm.overcommit_memory..."
          sudo sysctl -w vm.overcommit_memory=1

          echo "🔧 Vérification du réseau Docker 'web'..."
          if ! docker network ls | grep -q "web"; then
            echo "🌐 Création du réseau Docker 'web'..."
            sudo docker network create web
          fi

          echo "📥 Pull des dernières images..."
          sudo docker compose pull

          echo "🚀 Lancement des conteneurs..."
          sudo docker compose up -d --force-recreate

          echo "✅ Déploiement terminé."

      # ⚙️ 9️⃣ Commandes Symfony post-déploiement
      - name: ⚙️ Run post-deployment commands
        run: |
          echo "⏳ Pause de 15 secondes pour laisser les conteneurs s'initialiser..."
          sleep 15
          
          echo "🧹 Nettoyage et préparation du cache Symfony..."
          sudo docker exec symfony_app php bin/console cache:clear --env=prod
          
          echo "🔄 Application des migrations de la base de données..."
          sudo docker exec symfony_app php bin/console doctrine:migrations:migrate --no-interaction --env=prod

          echo "📦 Installation des assets..."
          sudo docker exec symfony_app php bin/console assets:install public

          echo "🔧 Réajustement des permissions sur les dossiers d'upload..."
          sudo mkdir -p public/assets/uploads
          sudo mkdir -p public/assets/images
          sudo chown -R www-data:www-data public/assets/uploads public/assets/images
          sudo chmod -R 775 public/assets/uploads public/assets/images

          echo "✅ Commandes post-déploiement terminées."
