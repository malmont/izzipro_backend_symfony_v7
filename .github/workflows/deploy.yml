name: Build and Deploy Backend to Kubernetes

on:
  push:
    branches:
      - main # ⚠️ Mettez ici le nom de votre branche de production

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout App Repository
        uses: actions/checkout@v4

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Determine Image Tag
        id: meta
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: 🏗️ Build and Push Docker Image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ env.IMAGE_TAG }}"
          echo "📦 Building and pushing image: $IMAGE_NAME"
          docker build -t $IMAGE_NAME -f Dockerfile .
          docker push $IMAGE_NAME
      
      - name: 🔄 Update K8s Config Repository
        run: |
          echo "🌀 Cloning K8s config repository..."
          # ⚠️ IMPORTANT : Créez ce secret dans les paramètres de votre dépôt de code.
          # Il doit contenir un "Personal Access Token" qui a le droit d'écrire sur votre dépôt de config.
          git clone https://x-access-token:${{ secrets.PAT_FOR_CONFIG_REPO }}@github.com/v2v-technologies/ecommerce-k8s.git k8s-config
          
          cd k8s-config

          echo "✏️ Updating image tag in deployment.yaml..."
          # Installation de yq, un outil pour éditer du YAML en ligne de commande
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq
          
          # La commande magique qui met à jour le tag de l'image
          yq e '.spec.template.spec.containers[0].image = "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ env.IMAGE_TAG }}"' -i ./apps/backend-symfony/deployment.yaml
          yq e '.spec.template.spec.containers[0].image = "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ env.IMAGE_TAG }}"' -i ./apps/backend-symfony/job-postsync-backend.yaml
          echo "🚀 Pushing configuration changes..."
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Deploy backend image ${{ env.IMAGE_TAG }}"
          git push
          
          echo "✅ Config repository updated. Argo CD will now deploy the new version."