name: Build and Deploy Docker Image to GHCR and Servers

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        client: [CLIENT1]  # Déploiement multi-serveurs

    steps:
      # 🔑 Configuration de la clé SSH
      - name: 🔑 Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 -H ${{ secrets.CLIENT1_SERVER_IP }} >> ~/.ssh/known_hosts
          echo "✅ Clé SSH ED25519 configurée."

      # 📥 Checkout du repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      # 🔄 Génération du fichier .env AVANT le build
      - name: 🔄 Générer le fichier .env localement
        run: |
          echo "📄 Génération du fichier .env..."
          cat <<EOL > .env
          POSTGRES_USER=${{ secrets.DB_USER }}
          POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
          POSTGRES_DB=${{ secrets.DB_NAME }}
          POSTGRES_HOST=${{ secrets.DB_HOST }}
          POSTGRES_PORT=${{ secrets.DB_PORT }}
          APP_ENV=prod
          APP_SECRET=${{ secrets.APP_SECRET }}
          DATABASE_URL=pgsql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}
          EOL
          echo "✅ Fichier .env généré localement."

      # 🔑 Connexion à GHCR
      - name: 🔑 Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 🏗️ Construction de l'image Docker avec le .env inclus
      - name: 🏗️ Build Docker Image with Tags
        run: |
          docker build --build-arg APP_ENV=prod -t ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }} .
          docker tag ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }} ghcr.io/${{ github.repository_owner }}/symfony-backend:latest

      # 📦 Push de l'image Docker
      - name: 📦 Push Docker Image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }}
          docker push ghcr.io/${{ github.repository_owner }}/symfony-backend:latest

      # 🛠️ Création du dossier de déploiement sur le serveur
      - name: 🛠️ Create app directory on server
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} \
            "mkdir -p /home/${{ secrets.CLIENT1_SERVER_USER }}/app && chown -R ${{ secrets.CLIENT1_SERVER_USER }}:${{ secrets.CLIENT1_SERVER_USER }} /home/${{ secrets.CLIENT1_SERVER_USER }}/app && chmod -R 755 /home/${{ secrets.CLIENT1_SERVER_USER }}/app"

      # 🔄 Synchronisation des fichiers avec rsync
      - name: 🔄 Synchroniser les fichiers avec rsync
        run: |
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            .env \
            Dockerfile \
            docker-compose.yml \
            docker-entrypoint.sh \
            generate-env.sh \
            docker/ \
            ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }}:/home/${{ secrets.CLIENT1_SERVER_USER }}/app/

      # 🚀 Déploiement des conteneurs Docker
      - name: 🚀 Deploy to Server
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} << 'EOF'
            cd /home/${{ secrets.CLIENT1_SERVER_USER }}/app/
            docker pull ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }}
            docker-compose down || true
            docker-compose up -d --build
            sleep 20
            chmod +x /home/${{ secrets.CLIENT1_SERVER_USER }}/app/docker-entrypoint.sh
            docker exec symfony_app bash /home/app/docker-entrypoint.sh
          EOF

      # ⚙️ Exécution des commandes Symfony
      - name: ⚙️ Lancer les commandes Symfony
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} << 'EOF'
            docker exec symfony_app php bin/console cache:clear
            docker exec symfony_app php bin/console doctrine:migrations:migrate --no-interaction
          EOF
