name: Build and Deploy Backend to Kubernetes

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout App Repository
        uses: actions/checkout@v4

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Determine Image Tag
        id: meta
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: 🏗️ Build and Push Docker Image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ env.IMAGE_TAG }}"
          echo "📦 Building and pushing image: $IMAGE_NAME"
          docker build -t $IMAGE_NAME -f Dockerfile .
          docker push $IMAGE_NAME
      
      # ⬇️⬇️ C'EST CE BLOC QUI EST ENTIÈREMENT CORRIGÉ ⬇️⬇️
      - name: 🔄 Update K8s Config Repository
        run: |
          echo "🌀 Cloning K8s config repository..."
          git clone https://x-access-token:${{ secrets.PAT_FOR_CONFIG_REPO }}@github.com/v2v-technologies/ecommerce-k8s.git k8s-config
          
          cd k8s-config

          echo "✏️ Installing yq..."
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq
          
          # Vérification de sécurité pour s'assurer que le tag n'est pas vide
          if [ -z "${{ env.IMAGE_TAG }}" ]; then
            echo "::error::IMAGE_TAG environment variable is empty. Aborting."
            exit 1
          fi

          # On utilise le nom dynamique du dépôt, comme vous le faites déjà
          IMAGE_URL="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ env.IMAGE_TAG }}"
          echo "Generated image URL: $IMAGE_URL"

          echo "✏️ Updating image tag in deployment.yaml (main container)..."
          yq e -i ".spec.template.spec.containers[0].image = \"$IMAGE_URL\"" ./apps/backend-symfony/deployment.yaml

          echo "✏️ Updating image tag in deployment.yaml (initContainer)..."
          # La commande que vous avez correctement identifiée comme manquante
          yq e -i ".spec.template.spec.initContainers[0].image = \"$IMAGE_URL\"" ./apps/backend-symfony/deployment.yaml

          echo "✏️ Updating image tag in job-postsync-backend.yaml..."
          yq e -i ".spec.template.spec.containers[0].image = \"$IMAGE_URL\"" ./apps/backend-symfony/job-postsync-backend.yaml

          echo "🚀 Pushing configuration changes..."
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          
          if git diff-index --quiet HEAD; then
            echo "No changes to commit. Skipping push."
          else
            git commit -m "Deploy backend image ${{ env.IMAGE_TAG }}"
            git push
            echo "✅ Config repository updated."
          fi