name: Build and Deploy Docker Image to GHCR and Server

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        client: [CLIENT1]  # Déploiement multi-serveurs

    steps:
      # 🔑 1️⃣ Configuration de la clé SSH
      - name: 🔑 Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519_backend_docker
          chmod 600 ~/.ssh/id_ed25519_backend_docker
          ssh-keyscan -t ed25519 -H ${{ secrets.CLIENT1_SERVER_IP }} >> ~/.ssh/known_hosts
          echo "✅ Clé SSH configurée."

      # 📥 2️⃣ Checkout complet du repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 🛠️ Création du dossier de déploiement avec permissions
      - name: 🛠️ Create app directory on server
        run: |
          echo "📂 Vérification et création du dossier app si nécessaire..."
          ssh -i ~/.ssh/id_ed25519_backend_docker -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} << 'EOF'
            if [ ! -d /home/${{ secrets.CLIENT1_SERVER_USER }}/app ]; then
              echo "📂 Création du dossier app..."
              sudo mkdir -p /home/${{ secrets.CLIENT1_SERVER_USER }}/app
              sudo chown -R ${{ secrets.CLIENT1_SERVER_USER }}:${{ secrets.CLIENT1_SERVER_USER }} /home/${{ secrets.CLIENT1_SERVER_USER }}/app
              sudo chmod -R 755 /home/${{ secrets.CLIENT1_SERVER_USER }}/app
              echo "✅ Dossier app créé avec les bonnes permissions."
            else
              echo "✅ Le dossier app existe déjà. Aucune action nécessaire."
            fi
          EOF

      # 🔄 3️⃣ Générer le fichier .env avec Messenger DSN et JWT
      - name: 🔄 Générer le fichier .env localement
        run: |
          echo "📄 Génération du fichier .env..."
          cat <<EOL > .env
          POSTGRES_USER=${{ secrets.DB_USER }}
          POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
          POSTGRES_DB=${{ secrets.DB_NAME }}
          POSTGRES_HOST=${{ secrets.DB_HOST }}
          POSTGRES_PORT=${{ secrets.DB_PORT }}
          APP_ENV=prod
          APP_SECRET=${{ secrets.APP_SECRET }}
          DATABASE_URL=pgsql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}

          ###> symfony/messenger ###
          MAILER_DSN=${{ secrets.MAILER_DSN }}
          ###< symfony/messenger ###

          ###> JWT ###
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          JWT_PUBLIC_KEY=${{ secrets.JWT_PUBLIC_KEY }}
          JWT_PASSPHRASE=${{ secrets.JWT_PASSPHRASE }}
          ###< JWT ###
          SQUARE_SECRET_KEY=${{ secrets.SQUARE_SECRET_KEY }}
          EOL
          echo "✅ Fichier .env généré."

      # 🔄 Synchronisation des fichiers avec rsync (y compris le .env)
      - name: 🔄 Synchroniser les fichiers avec rsync
        run: |
          echo "📤 Synchronisation des fichiers avec rsync..."
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519_backend_docker -o StrictHostKeyChecking=no" \
            .env \
            Dockerfile \
            docker-compose.yml \
            docker/ \
            ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }}:/home/${{ secrets.CLIENT1_SERVER_USER }}/app/
          echo "✅ Synchronisation terminée."

      # ⚙️ Création du dossier public pour les assets Symfony
      - name: ⚙️ Générer et synchroniser les fichiers d'assets Symfony
        run: |
          echo "📂 Préparation du dossier public sur le serveur distant..."
          ssh -i ~/.ssh/id_ed25519_backend_docker -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} << 'EOF'
            if [ ! -d /home/${{ secrets.CLIENT1_SERVER_USER }}/app/public ]; then
              echo "📂 Création du dossier public sur le serveur distant..."
              sudo mkdir -p /home/${{ secrets.CLIENT1_SERVER_USER }}/app/public
              sudo chmod -R 700 /home/${{ secrets.CLIENT1_SERVER_USER }}/app/public
              echo "✅ Dossier public créé sur le serveur distant."
            else
              echo "✅ Le dossier public existe déjà sur le serveur distant."
            fi
          EOF

      # 🔑 Création du dossier jwt pour les clés JWT
      - name: 🔑 Vérifier et créer le dossier jwt sur le serveur distant
        run: |
          echo "📂 Vérification et préparation du dossier jwt sur le serveur distant..."
          ssh -i ~/.ssh/id_ed25519_backend_docker -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} << 'EOF'
            JWT_DIR="/home/${{ secrets.CLIENT1_SERVER_USER }}/app/jwt"
            if [ ! -d "$JWT_DIR" ]; then
              echo "📂 Création du dossier jwt sur le serveur distant..."
              sudo mkdir -p "$JWT_DIR"
              sudo chmod -R 700 "$JWT_DIR"
              echo "✅ Dossier jwt créé sur le serveur distant."

              echo "🔑 Génération des clés JWT..."
              sudo openssl genrsa -out "$JWT_DIR/private.pem" 2048
              sudo openssl rsa -pubout -in "$JWT_DIR/private.pem" -out "$JWT_DIR/public.pem"
              sudo chmod 600 "$JWT_DIR/private.pem" "$JWT_DIR/public.pem"

              echo "⚙️ Ajustement des permissions pour le conteneur..."
              sudo chown -R www-data:www-data "$JWT_DIR"
              sudo chmod -R 750 "$JWT_DIR"

              echo "✅ Clés JWT générées et permissions ajustées."
            else
              echo "✅ Le dossier jwt existe déjà sur le serveur distant. Aucun changement."
            fi
          EOF

      # 🔑 5️⃣ Connexion à GHCR
      - name: 🔑 Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
          
      # 🏗️ 7️⃣ Construire l'image Symfony Docker Image
      - name: 🏗️ Build Symfony Docker Image
        run: |
          echo "📦 Construction de l'image Symfony"
          docker build --build-arg APP_ENV=prod -t ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }} -f Dockerfile .
          docker tag ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }} ghcr.io/${{ github.repository_owner }}/symfony-backend:latest
          echo "✅ Image Symfony construite."

      # 🏗️ 7️⃣ Construire l'image Nginx Docker Image
      - name: 🏗️ Build Nginx Docker Image
        run: |
          echo "📦 Construction de l'image Nginx"
          docker build -t ghcr.io/${{ github.repository_owner }}/symfony-nginx:${{ matrix.client }} -f Dockerfile.nginx .
          docker tag ghcr.io/${{ github.repository_owner }}/symfony-nginx:${{ matrix.client }} ghcr.io/${{ github.repository_owner }}/symfony-nginx:latest
          echo "✅ Image Nginx construite."

      # 📦 8️⃣ Push des images Docker
      - name: 📦 Push Docker Images to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/symfony-backend:${{ matrix.client }}
          docker push ghcr.io/${{ github.repository_owner }}/symfony-backend:latest

          docker push ghcr.io/${{ github.repository_owner }}/symfony-nginx:${{ matrix.client }}
          docker push ghcr.io/${{ github.repository_owner }}/symfony-nginx:latest
          echo "✅ Images Docker poussées vers GHCR."

      # 🚀 9️⃣ Déploiement sans rebuild
      - name: 🚀 Déployer les conteneurs
        run: |
          ssh -i ~/.ssh/id_ed25519_backend_docker -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} << 'EOF'
            cd /home/${{ secrets.CLIENT1_SERVER_USER }}/app/

            echo "🔧 Vérification du réseau Docker 'web'..."
            if ! docker network ls | grep -q "web"; then
              echo "🌐 Création du réseau Docker 'web'..."
              sudo docker network create web
            else
              echo "✅ Le réseau 'web' existe déjà."
            fi

            echo "📥 Pull des dernières images..."
            sudo docker-compose pull  # ✅ Pull sans rebuild

            echo "🛑 Arrêt des anciens conteneurs..."
            sudo docker-compose down

            echo "🚀 Lancement des conteneurs..."
            sudo docker-compose up -d

            echo "✅ Déploiement terminé."
          EOF

      # ⚙️ 🔟 Commandes Symfony post-déploiement
      - name: ⚙️ Exécuter les commandes Symfony
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} << 'EOF'
            echo "Pause de 10 secondes pour laisser le container s'initialiser..."
            sleep 12
            sudo docker exec symfony_app php bin/console cache:clear --env=prod --no-warmup
            sudo docker exec symfony_app php bin/console cache:warmup --env=prod
            sudo docker exec symfony_app php bin/console doctrine:migrations:migrate --no-interaction --env=prod
          EOF

      # ⚙️ 10️⃣ Regénérer les fichiers d'assets Symfony
      - name: ⚙️ Regénérer et copier les fichiers d'assets Symfony
        run: |
          ssh -i ~/.ssh/id_ed25519_backend_docker -o StrictHostKeyChecking=no ${{ secrets.CLIENT1_SERVER_USER }}@${{ secrets.CLIENT1_SERVER_IP }} << 'EOF'
            echo "🔄 Vérification du conteneur Symfony..."
            if docker ps | grep -q "symfony_app"; then
              echo "✅ Conteneur Symfony trouvé. Installation des assets..."
              sudo docker exec symfony_app php bin/console assets:install
              echo "✅ Assets Symfony installés."

              # Chemin vers le répertoire local
              LOCAL_PUBLIC_DIR="/home/${{ secrets.CLIENT1_SERVER_USER }}/app/public"

              # Vérifiez si le répertoire local est vide
              if [ -z "$(ls -A $LOCAL_PUBLIC_DIR 2>/dev/null)" ]; then
                echo "📤 Copie des assets vers $LOCAL_PUBLIC_DIR..."
                sudo docker cp symfony_app:/var/www/public $LOCAL_PUBLIC_DIR
                echo "✅ Assets copiés et permissions mises à jour."
              else
                echo "🛑 Le répertoire $LOCAL_PUBLIC_DIR n'est pas vide, aucun fichier n'a été écrasé."
              fi

            else
              echo "❌ Conteneur Symfony non trouvé !" >&2
              exit 1
            fi
          EOF
