name: Deploy PR Environment (Backend)

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches:
      - dev

jobs:
  deploy-pr:
    name: Manage PR Environment
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      packages: write
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: 📥 Checkout App Repository
        uses: actions/checkout@v4

      # ==========================================
      # CONFIGURATION DES VARIABLES D'ENVIRONNEMENT PR
      # ==========================================
      - name: 🏷️ Set PR Environment Variables
        run: |
          # Extraire et nettoyer le nom de la branche source de la PR (ex: feature/tache-100 -> feature-tache-100)
          PR_ID=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//' | cut -c1-30)
          DB_SUFFIX=$(echo $PR_ID | tr '-' '_')
          echo "PR_ID=$PR_ID" >> $GITHUB_ENV
          echo "DB_NAME=db_pr_$DB_SUFFIX" >> $GITHUB_ENV
          echo "TENANT_CODE=qa-pr-$PR_ID" >> $GITHUB_ENV
          echo "DOMAIN=pr-$PR_ID.gem-portal.ca" >> $GITHUB_ENV
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER=$OWNER" >> $GITHUB_ENV

      # ==========================================
      # SCÉNARIO 1 : PR CRÉÉE OU MISE A JOUR
      # ==========================================
      - name: 🔑 Login to GHCR (Runner Local)
        if: github.event.action != 'closed'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: 🏗️ Build Docker Image (Open/Sync)
        if: github.event.action != 'closed'
        run: |
          IMAGE_TAG="pr-${{ env.PR_ID }}"
          IMAGE_NAME="ghcr.io/${{ env.OWNER }}/lizipro:$IMAGE_TAG"
          echo "Building image $IMAGE_NAME..."
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: 🌐 Clone K8s Config Repo
        if: github.event.action != 'closed'
        run: |
          git clone https://x-access-token:${{ secrets.PAT_FOR_CONFIG_REPO }}@github.com/v2v-technologies/ecommerce-k8s.git k8s-config

      - name: 🗄️ Clone Postgres Database & Register Tenant
        if: github.event.action != 'closed'
        run: |
          echo "Cloning database db_expertnautique to ${{ env.DB_NAME }} on QA DB server..."
          docker run --rm -e PGPASSWORD="${{ secrets.QA_DB_PASSWORD }}" postgres:14-alpine psql -h 172.16.7.18 -U db_creator -d postgres -c "DROP DATABASE IF EXISTS ${{ env.DB_NAME }} WITH (FORCE);"
          docker run --rm -e PGPASSWORD="${{ secrets.QA_DB_PASSWORD }}" postgres:14-alpine psql -h 172.16.7.18 -U db_creator -d postgres -c "CREATE DATABASE ${{ env.DB_NAME }} TEMPLATE db_expertnautique OWNER db_creator;"
          docker run --rm -e PGPASSWORD="${{ secrets.QA_DB_PASSWORD }}" postgres:14-alpine psql -h 172.16.7.18 -U db_creator -d master -c "DELETE FROM tenants WHERE code='${{ env.TENANT_CODE }}';"
          docker run --rm -e PGPASSWORD="${{ secrets.QA_DB_PASSWORD }}" postgres:14-alpine psql -h 172.16.7.18 -U db_creator -d master -c "INSERT INTO tenants (id, code, name, dbname, custom_domain, gemsuite_token, is_internal_store) VALUES (${{ github.event.number }}, '${{ env.TENANT_CODE }}', 'PR ${{ github.event.number }} (${{ env.PR_ID }})', '${{ env.DB_NAME }}', '${{ env.DOMAIN }}', 'AbtGr19LzIQvc+LDvyHM/EZHy/ATuIRB+yeXyRtXslR0gHXqmyE0txPJTd4fDJAHmaq0ml3WdTw3VaV+Myugpg==', 'f');"

      - name: ☸️ Setup K8s Namespace & Config
        if: github.event.action != 'closed'
        run: |
          NS="qa-pr-${{ env.PR_ID }}"
          
          # 1. Créer le namespace
          sed "s/__PR_NUMBER__/${{ env.PR_ID }}/g" k8s-config/templates-pr/namespace.yaml | kubectl apply -f -
          
          # 2. Copier les secrets de base
          kubectl get secret ghcr-credentials -n qa -o json | jq ".metadata.namespace = \"$NS\"" | kubectl apply -f -
          kubectl get secret backend-jwt-secret -n qa -o json | jq ".metadata.namespace = \"$NS\"" | kubectl apply -f -
          kubectl get secret gem-portal-backend-com-wildcard-tls -n qa -o json | jq ".metadata.namespace = \"$NS\"" | kubectl apply -f -
          kubectl get secret gem-portal-ca-wildcard-tls -n qa -o json | jq ".metadata.namespace = \"$NS\"" | kubectl apply -f -
          kubectl get configmap nginx-conf -n qa -o json | jq ".metadata.namespace = \"$NS\"" | kubectl apply -f -

          # 3. Récupérer le secret d'env, modifier la DATABASE_URL pour pointer vers la base éphémère et appliquer dans le namespace PR
          RAW_SECRET=$(kubectl get secret backend-env-secret -n qa -o json)
          DEC_URL=$(echo "$RAW_SECRET" | jq -r '.data.DATABASE_URL | @base64d' | sed "s/db_expertnautique/${{ env.DB_NAME }}/g")
          ENC_URL=$(echo -n "$DEC_URL" | base64 -w 0)
          
          echo "$RAW_SECRET" | jq ".metadata.namespace = \"$NS\" | .data.DATABASE_URL = \"$ENC_URL\"" | kubectl apply -f -

      - name: 🚀 Deploy App Components (Redis + Backend + Frontend par défaut)
        if: github.event.action != 'closed'
        run: |
          IMAGE_TAG="pr-${{ env.PR_ID }}"
          
          # 1. Déployer Redis
          sed -e "s/__PR_NUMBER__/${{ env.PR_ID }}/g" \
              -e "s/__IMAGE_TAG__/dev/g" \
              -e "s/__GITHUB_REPOSITORY_OWNER__/${{ env.OWNER }}/g" \
              k8s-config/templates-pr/redis-pr.yaml | kubectl apply -f -

          # 2. Déployer le Backend (avec l'image de la PR)
          sed -e "s/__PR_NUMBER__/${{ env.PR_ID }}/g" \
              -e "s/__IMAGE_TAG__/$IMAGE_TAG/g" \
              -e "s/__GITHUB_REPOSITORY_OWNER__/${{ env.OWNER }}/g" \
              k8s-config/templates-pr/backend-pr.yaml | kubectl apply -f -

          # 3. Déployer le Frontend (avec l'image stable 'dev' par défaut, si le front n'a pas encore été déployé pour cette PR)
          NS="qa-pr-${{ env.PR_ID }}"
          if ! kubectl get deployment frontend-react -n $NS >/dev/null 2>&1; then
            echo "Deploying default dev frontend..."
            sed -e "s/__PR_NUMBER__/${{ env.PR_ID }}/g" \
                -e "s/__IMAGE_TAG__/dev/g" \
                -e "s/__GITHUB_REPOSITORY_OWNER__/${{ env.OWNER }}/g" \
                k8s-config/templates-pr/frontend-pr.yaml | kubectl apply -f -
          fi

      - name: ⚙️ Run Database Migrations in Pod
        if: github.event.action != 'closed'
        run: |
          NS="qa-pr-${{ env.PR_ID }}"
          
          echo "Waiting for backend pod to be ready..."
          kubectl rollout status deployment/backend-symfony -n $NS --timeout=90s
          
          POD_NAME=$(kubectl get pods -n $NS -l app=backend-symfony -o jsonpath='{.items[0].metadata.name}')
          
          echo "Running database migrations..."
          kubectl exec -n $NS $POD_NAME -c app -- php bin/console doctrine:migrations:migrate --no-interaction --env=prod

      - name: 💬 Add PR Review Link Comment
        if: github.event.action != 'closed'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            🚀 **Environnement éphémère déployé avec succès !**
            * 🖥️ **Frontend** : [https://pr-${{ env.PR_ID }}.gem-portal.ca](<https://pr-${{ env.PR_ID }}.gem-portal.ca>)
            * ⚙️ **API Backend** : [https://pr-${{ env.PR_ID }}.gem-portal-backend.com](<https://pr-${{ env.PR_ID }}.gem-portal-backend.com>)
            * 🗄️ **Base de données isolée** : `${{ env.DB_NAME }}`
          comment_tag: pr_preview_env

      # ==========================================
      # SCÉNARIO 2 : PR FERMÉE OU FUSIONNÉE
      # ==========================================
      - name: 🧹 Clean up PR Environment (Close)
        if: github.event.action == 'closed'
        run: |
          NS="qa-pr-${{ env.PR_ID }}"
          
          echo "Deleting namespace $NS..."
          kubectl delete namespace $NS --ignore-not-found=true
          
          echo "Dropping database ${{ env.DB_NAME }} and removing tenant..."
          docker run --rm -e PGPASSWORD="${{ secrets.QA_DB_PASSWORD }}" postgres:14-alpine psql -h 172.16.7.18 -U db_creator -d postgres -c "DROP DATABASE IF EXISTS ${{ env.DB_NAME }} WITH (FORCE);"
          docker run --rm -e PGPASSWORD="${{ secrets.QA_DB_PASSWORD }}" postgres:14-alpine psql -h 172.16.7.18 -U db_creator -d master -c "DELETE FROM tenants WHERE code='${{ env.TENANT_CODE }}';"
