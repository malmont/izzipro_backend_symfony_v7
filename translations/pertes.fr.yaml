# Assistant d'installation des étiquettes à puce (lot L2-b)
installation:
    steps:
        hardware:
            title: Choisir son matériel
            text: 'Trois niveaux pour chaque besoin : lire une puce, imprimer l''étiquette, poser la puce. Regardez la gamme et prenez ce qui convient à votre boutique.'
            verify: Voir la gamme
            hint: 'Cette étape n''a rien à vérifier : elle est faite dès que vous imprimez une étiquette d''essai, lisez une puce ou posez une puce sur une pièce.'
        test_label:
            title: Imprimer une étiquette d'essai
            text: 'Imprimez l''étiquette d''essai dans le format de votre imprimante : planche A4 ou rouleau. Vérifiez qu''elle sort droite et que les barres sont nettes.'
            verify: Vérifier
            hint: 'Aucune étiquette d''essai n''a encore été demandée. Choisissez le format de votre imprimante et imprimez-la.'
        test_tag:
            title: Lire une puce d'essai
            text: 'Approchez une puce du lecteur. L''application doit afficher son identifiant.'
            verify: Vérifier
            hint: 'Aucune puce n''a encore été lue. Si rien ne s''affiche : réglez le lecteur pour qu''il écrive comme un clavier, placez le curseur dans le champ de la puce, et rapprochez la puce.'
        first_piece:
            title: Poser la puce sur une première pièce
            text: 'Lisez le code-barres d''un article, puis sa puce : la pièce est créée et porte sa puce.'
            verify: Vérifier
            hint: 'Aucune pièce ne porte encore de puce. Lisez le code-barres d''un article, puis une puce libre.'
        box:
            title: Brancher un boîtier
            text: 'Facultatif. Le boîtier relie à la plateforme le tapis de comptoir, l''imprimante à puce et la caméra. Ajoutez-le dans « Boîtiers », puis inscrivez sa machine avec la clé.'
            verify: Vérifier
            hint: 'Aucun boîtier n''est inscrit. Ajoutez un boîtier, puis lancez sur sa machine la commande d''inscription avec l''adresse du site et la clé.'
    hint:
        decimal: 'Le lecteur semble rendre un numéro en chiffres seulement. Réglez-le pour qu''il rende l''identifiant en hexadécimal (chiffres et lettres de A à F).'
        form: 'Cette lecture contient autre chose que des chiffres et des lettres de A à F : ce n''est pas une puce. Vérifiez que le curseur est dans le champ de la puce.'
        length_nfc: 'Cette lecture n''a pas la longueur d''une puce NFC (8, 14, 16 ou 20 caractères). Essayez l''autre technologie, ou une autre puce.'
        length_uhf: 'Cette lecture n''a pas la longueur d''une puce lisible à distance (16 à 64 caractères, par groupes de 4). Essayez l''autre technologie, ou une autre puce.'
        simulated: 'Cette lecture n''est pas celle d''une puce simulée.'
        barcode: 'Cette lecture est le code-barres de « %label% », pas une puce : lisez la puce.'
        already_associated: 'La lecture marche. Cette puce est déjà posée sur une pièce : prenez-en une libre pour la suite.'
        retired: 'La lecture marche. Cette puce a été retirée : prenez-en une libre pour la suite.'
    test_label:
        title: Étiquette d'essai
        subtitle: Prévention des pertes
        note: 'Ne désigne aucun article'
    error:
        STEP_NOT_FOUND: 'Étape inconnue.'
# Gamme de matériel des étiquettes à puce (lot L2-b) : trois niveaux par besoin, sans prix
hardware:
    note: 'Le niveau bricoleur se vend sans matériel : vous achetez vous-même les pièces. Les trois niveaux donnent les mêmes pièces et les mêmes puces dans l''application.'
    levels:
        pro:
            label: Pro
            summary: 'Tout d''un geste : l''imprimante écrit la puce en imprimant l''étiquette, le lecteur à main lit à distance.'
        standard:
            label: Standard
            summary: 'Des puces autocollantes déjà numérotées, une imprimante thermique ordinaire, un lecteur de bureau.'
        diy:
            label: Bricoleur
            summary: 'Les mêmes puces autocollantes, des étiquettes sur feuilles A4, le téléphone ou une carte à monter soi-même pour lire.'
    needs:
        read:
            label: Lire une puce
            pro:
                what: 'Un lecteur à main de puces lisibles à distance (UHF).'
                allows: 'Lire une puce à plusieurs mètres, sans la chercher ; prêt pour le comptage et les antennes à venir.'
                limits: 'Le plus cher des trois.'
            standard:
                what: 'Un lecteur de bureau de puces UHF, branché en USB, qui écrit comme un clavier.'
                allows: 'Lire une puce posée sur le lecteur ; prêt pour les antennes à venir.'
                limits: 'Une puce à la fois, à quelques centimètres.'
            diy:
                what: 'Un téléphone qui lit le NFC, ou un module lecteur monté sur une carte de type Arduino et branché en clavier.'
                allows: 'Associer une puce et contrôler une pièce, pour presque rien.'
                limits: 'Lecture à quelques centimètres ; les puces NFC ne servent ni au comptage à distance ni aux antennes.'
        print:
            label: Imprimer l'étiquette
            pro:
                what: 'Une imprimante qui imprime l''étiquette et écrit la puce d''un même geste.'
                allows: 'Une seule étiquette, code-barres et puce ensemble.'
