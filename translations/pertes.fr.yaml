            pro:
                what: 'Des étiquettes à puce intégrée, sorties de l''imprimante.'
                allows: 'Une pose, un geste.'
                limits: 'Étiquettes plus chères à l''unité.'
            standard:
                what: 'Des puces autocollantes déjà numérotées en usine.'
                allows: 'Coller la puce sur l''étiquette détachable de l''article, puis la lire une fois.'
