# Loss prevention (lot L1-a, 2026-11-14, `docs/prevention-pertes.md`): texts written by the server, served according to ?locale=.
# Rule: a summary (`summary.*`) never names anyone; it only uses counts and amounts.
status:
    open: New
    watch: To watch
    explained: Explained
    dismissed: Dismissed
    confirmed: Confirmed
role:
    seller: Sale
    closer: Cash register closing
    approver: Approval
    operator: Performed the action
user:
    unnamed: 'Account no. %id%'
subject:
    cash_register: Till
    user_window: Series of actions by the same account
    terminal: Cash register tablet
    zone: Shop zone
    count: Stock count
    countNumber: 'Count no. %number%'
onDutyNotice: 'These people were on duty when the events took place. This is not an accusation: the decision is yours, after checking.'
amountNotice: 'The amount at stake is the amount the finding is about, not a proven loss.'
caveats:
    MODULE_NOT_GRANTED: 'The Loss prevention module is not granted to this site: nothing is analysed. Request it from “My site”.'
    ENTRIES_SKIPPED: '%count% cash register operation(s) could not be analysed. Report it to support: they will not be read again.'
    RECORDED_SALES_ONLY: 'The analysis only sees what the cash register recorded: a line removed from the cart before payment leaves no trace.'
    STAFF_NOTICE_REQUIRED: 'The analysis only starts once you have confirmed that you informed your staff (Settings).'
rules:
    previewNotice: 'Preview over the last 30 days: nothing is saved, no finding is created or closed.'
    previewUnavailable: 'This rule judges the reads of the exit antennas: the preview only replays the till journal, it cannot count it.'
    notice: 'Changing a threshold neither closes nor deletes any finding: the new setting only applies to later analyses.'
    CASH_DISCREPANCY:
        label: Cash discrepancy at closing
        description: 'When a cash register is closed, the cash counted does not match the cash expected, beyond the tolerated discrepancy.'
        params:
            minAmount: 'Minimum discrepancy that opens a finding (on top of the tolerated discrepancy of the site)'
        person:
            label: Repeated cash shortages by the same account
            description: 'Several closings with a shortage, closed by the same account, over a short period.'
            params:
                count: Number of shortages
                days: Over how many days
    DRAWER_NO_SALE:
        label: Drawer opened without a sale
        description: 'The cash drawer was opened several times without a sale during the same session.'
        params:
            maxPerSession: No-sale drawer openings tolerated per session
    VOID_AFTER_SALE:
        label: Sale cancelled after payment
        description: 'A sale paid in cash is cancelled shortly afterwards, or several sales are cancelled during the same session.'
        params:
            minutes: 'Delay after the sale during which a cancellation opens a finding'
            perSession: Number of cancellations in a session that opens a finding
    REFUND_PATTERN:
        label: Unusual return
        description: 'A return without a receipt, or cash given back for a sale that had not been paid in cash.'
        person:
            label: Repeated returns by the same account
            description: 'Several returns made by the same account during the same day.'
            params:
                count: Number of returns during the day
    DISCOUNT_PATTERN:
        label: Discounts with a vague reason
        description: 'Several sales discounted with the reason “Other”, or with no reason, during the same session.'
        params:
            perSession: Number of discounted sales in a session that opens a finding
        person:
            label: Repeated discounts near the limit by the same account
            description: 'Several sales rung up by the same account with a discount close to the limit allowed to the cashier.'
            params:
                count: Number of discounted sales
                days: Over how many days
                share: 'Share of the cashier limit from which a discount counts (in %)'
    PRICE_OVERRIDE:
        label: Prices lowered by hand
        description: 'Several items sold at a price entered by hand, below the catalogue price, during the same session.'
        params:
            perSession: Number of price reductions in a session that opens a finding
    APPROVAL_PATTERN:
        label: Refused approvals
        description: 'Several manager approvals refused on the same tablet during the same day (wrong code, locked code, account not allowed to approve).'
        params:
            perDay: Number of refused approvals during the day that opens a finding
    UNREAD_SOLD:
        label: Tracked items sold without a read
        description: 'On one till and one day, several tracked items were sold without their piece being read, neither on the counter mat nor at the exit. Per till, never per person.'
        params:
            minCount: Number of items sold without a read in the day that opens a finding
            minShare: Minimum share of these items among the tracked items sold that day on the till (in %)
    EXIT_WITHOUT_SALE:
        label: Exit without a sale
        description: 'A tracked piece, neither sold nor retired, was read by the exit antenna, and no sale explains it once the catch-up window has passed. One finding per piece and per day; later reads of the same day are added to it. Per piece, never per person.'
        params: {  }
    EXIT_COVERED:
        label: Exit matched on a partly tagged item
        description: 'A piece read at the exit was matched to a sale whose tag had not been read. As not every piece of this item carries a tag, we cannot be sure it is the piece that was sold. Tagging the whole item removes the doubt.'
        params:
            minCount: Number of matched exits in the week on the same item from which the severity goes from low to medium
    STOCKROOM_NOT_SHELVED:
        label: Left the stockroom without being shelved
        description: 'A tracked piece went through the stockroom door, then was seen neither on the shop floor, at the counter nor back in the stockroom, and was not sold, within the delay. One finding per day and per zone, each piece being evidence. Silent while no shop-floor or counter antenna is in service. Never per person.'
        params:
            minutes: Delay to see the piece again on the shop floor, at the counter or in the stockroom (minutes)
            minCount: Number of pieces in the day from which the severity goes from low to medium
    BACK_DOOR:
        label: Stockroom back door
        description: 'A tracked piece, not retired, was read by the antenna at the stockroom back door. Judged at the end of the day: a piece retired that day opens nothing. The antenna does not tell the direction: a piece coming back through this door also opens a finding, to be dismissed. One finding per day, never per person.'
        params:
            minCount: Number of pieces in the day from which the severity goes from medium to high
    OUT_OF_HOURS:
        label: Movement outside opening hours
        description: 'A tracked piece arrived in or left a zone outside the opening hours you confirmed, margins included. Without confirmed hours, the rule says nothing. A stock count or shelving after closing also opens one. One finding per day and per zone, never per person.'
        params:
            minCount: Number of pieces in the day from which the severity goes from low to medium
    PIECE_MISSING:
        label: Piece missing at the count
        description: 'A tracked piece was read neither at this count nor at the previous closed count that covered it: it becomes "missing". One finding per count, each piece being evidence. Read again later, it gets its state back and the finding says so. Never per person.'
        params:
            minCount: Number of missing pieces in the same count from which the severity goes from medium to high
