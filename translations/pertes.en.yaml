notice:
    title: Staff notice about loss prevention
    text: |
        The shop uses a loss prevention tool. It compares what the cash register records (sales, cancellations, refunds, discounts, drawer openings, register closings) with known rules, and reports discrepancies to the shop administrator for checking.
        What the tool does: it raises findings, with dated evidence, from the cash register operations you perform with your account.
        What it does not do: it makes no decision, applies no sanction, uses neither facial recognition, nor audio, nor any camera in fitting rooms, and does not analyse your gestures.
        Who sees the findings: the shop administrator only. Opening the record of a finding is logged, with the account that opens it and the day.
        Your rights: you can ask the shop administrator which data concerns you, have it corrected, and give your explanation before any decision.
