settings:
    pieces:
        retention: 'Presences on the counter mat and in the zones, closed for more than %days% days, are erased automatically; the last zone where each piece was seen is kept. Facts (reads, sales, returns) are kept.'
    openingHours:
        suggestion: 'Taken from bookings, to be checked: the range in which a booking can start, the same every day. These are not necessarily your opening hours; confirm them day by day.'
        confirmed: 'Hours confirmed: a piece moved outside them, margins included, opens an "outside opening hours" finding.'
        none: 'No opening hours confirmed: the "movement outside opening hours" rule says nothing until you confirm them day by day.'
