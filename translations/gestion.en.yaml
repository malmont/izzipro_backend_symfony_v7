# Management guide (lot G1a, 11/11/2026, docs/guide-ia-gestion.md): rule fallback texts, labels
advice:
    kinds:
        FAST_SELLER:
            title: "%name% is selling fast"
            text: "%name%: %sold_30_days% sales in 30 days, %coverage_days% days of stock left. A %price_increase% price increase would bring about %effect% by the end of the period."
        SLOW_STOCK:
            title: "%name% is not selling"
            text: "No sales for %days_without_sale% days, %cost_value% tied up at cost. Try a %promotion% promotion in the simulator."
        AD_RELAUNCH:
            title: "Run the %channel% ad again"
            text: "Your %channel% campaign brought %gain_per_dollar% $ of margin per 1 $ spent. Running it again with %campaign_amount% would bring about %effect% of net margin."
        BUDGET_PACE:
            title: "%category%: watch out"
            text: "Planned %planned%, already %actual% spent at %elapsed_share% of the period: about %effect% over."
        TRIP_BUDGET:
            title: "Trip budget in %place%"
            text: "Spent %trip_spent% of %trip_budget%: %trip_remaining% left, %trip_daily_left% a day for %trip_days_left% days."
        TRIP_COEFFICIENT:
            title: "Markup of purchases in %place%"
            text: "Trip purchases are at a %trip_coefficient% markup versus %reference_coefficient% usually. At the usual markup they would be worth about %effect% more at retail."
        CASH_TIGHT:
            title: "Cash is tight"
            text: "Your expected balance drops to %cash_low% on %cash_low_date%, below your %cash_threshold% threshold."
        PURCHASE_CAPACITY:
            title: "Postpone stock purchases"
            text: "%remaining_purchases% of planned stock purchases remain: your cash does not allow them before %date%."
            text_later: "%remaining_purchases% of planned stock purchases remain: your cash does not allow them within the next %horizon_days% days."
        END_CLEARANCE:
            title: "Clear the remaining stock"
            text: "About %end_stock_value% of stock at cost will be left at the end of the period. A %promotion% promotion on %count% slow items could free about %effect%."
        PACE_BEHIND:
            title: "Behind last year"
            text: "Expected sales for the period: %expected_sales%, versus %last_year_sales% last year (%sales_ratio%)."
        PACE_AHEAD:
            title: "Ahead of last year"
            text: "Expected sales for the period: %expected_sales%, versus %last_year_sales% last year (%sales_ratio%)."
        CLOSING_REVIEW:
            title: "Period review"
            text: "Sales %revenue%, margin %gross_margin%, net result %net_result%."
        LESSON_STOCKOUT:
            title: "Lesson: stockouts"
            text: "%count% items sold out (%units_sold% sales): plan more of them for the same period next year."
        LESSON_OVERSTOCK:
            title: "Lesson: unsold stock"
            text: "%count% items did not sell: %cost_value% remain tied up at cost. Buy fewer next year."
        LESSON_BUDGET:
            title: "Lesson: %category% over budget"
            text: "Planned %planned%, spent %actual%: plan more, or watch this item earlier next year."
        RENTAL_PEAK_DAYS:
            title: "%name%: busy days"
            text: "%name% is rented at %occupancy% on %weekdays% (%rentals% rentals in 8 weeks). A %price_increase% increase on those days would bring about %effect% by the end of the period."
        RENTAL_LOW_WEEKDAYS:
            title: "%name%: quiet weekdays"
            text: "%name% is only %occupancy% occupied over 30 days, %weekday_occupancy% Monday to Thursday. A %promotion% weekday promotion could fill those days: potential of about %effect%."
        RENTAL_IDLE:
            title: "%name% is no longer rented"
