            title: "Trésorerie tendue"
            text: "Le solde prévu descend à %cash_low% le %cash_low_date%, sous votre seuil de %cash_threshold%."
        PURCHASE_CAPACITY:
            title: "Achats de stock à décaler"
            text: "Il reste %remaining_purchases% d’achats de stock prévus : la trésorerie ne le permet pas avant le %date%."
            text_later: "Il reste %remaining_purchases% d’achats de stock prévus : la trésorerie ne le permet pas dans les %horizon_days% prochains jours."
        END_CLEARANCE:
            title: "Écouler le stock restant"
            text: "Il restera environ %end_stock_value% de stock au coût en fin de période. Une promotion de %promotion% sur %count% articles lents pourrait libérer environ %effect%."
