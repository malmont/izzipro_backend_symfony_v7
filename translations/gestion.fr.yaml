# Guide IA de la gestion (lot G1a, 11/11/2026, docs/guide-ia-gestion.md) : textes de repli des règles, libellés
advice:
    kinds:
        FAST_SELLER:
            title: "%name% part vite"
            text: "%name% : %sold_30_days% ventes en 30 jours, %coverage_days% jours de stock. Une hausse de %price_increase% rapporterait environ %effect% d’ici la fin de la période."
        SLOW_STOCK:
            title: "%name% dort en stock"
            text: "Aucune vente depuis %days_without_sale% jours, %cost_value% immobilisés au coût. Essayez une promotion de %promotion% dans le simulateur."
        AD_RELAUNCH:
            title: "Relancer la publicité %channel%"
            text: "Votre campagne %channel% a rapporté %gain_per_dollar% $ de marge pour 1 $ dépensé. La relancer avec %campaign_amount% rapporterait environ %effect% de marge nette."
        BUDGET_PACE:
            title: "Poste %category% : attention"
            text: "Prévu %planned%, déjà %actual% dépensés à %elapsed_share% de la période : dépassement d’environ %effect%."
        TRIP_BUDGET:
            title: "Budget du voyage à %place%"
            text: "Dépensé %trip_spent% sur %trip_budget% : il reste %trip_remaining%, soit %trip_daily_left% par jour pour %trip_days_left% jours."
        TRIP_COEFFICIENT:
            title: "Coefficient des achats à %place%"
            text: "Les achats du voyage sont au coefficient %trip_coefficient% contre %reference_coefficient% d’habitude. Au coefficient habituel, ils vaudraient environ %effect% de plus à la vente."
        CASH_TIGHT:
            title: "Trésorerie tendue"
            text: "Le solde prévu descend à %cash_low% le %cash_low_date%, sous votre seuil de %cash_threshold%."
        PURCHASE_CAPACITY:
            title: "Achats de stock à décaler"
            text: "Il reste %remaining_purchases% d’achats de stock prévus : la trésorerie ne le permet pas avant le %date%."
            text_later: "Il reste %remaining_purchases% d’achats de stock prévus : la trésorerie ne le permet pas dans les %horizon_days% prochains jours."
        END_CLEARANCE:
            title: "Écouler le stock restant"
            text: "Il restera environ %end_stock_value% de stock au coût en fin de période. Une promotion de %promotion% sur %count% articles lents pourrait libérer environ %effect%."
        PACE_BEHIND:
            title: "En retard sur l’an dernier"
            text: "Ventes prévues de la période : %expected_sales%, contre %last_year_sales% l’an dernier (%sales_ratio%)."
        PACE_AHEAD:
            title: "En avance sur l’an dernier"
            text: "Ventes prévues de la période : %expected_sales%, contre %last_year_sales% l’an dernier (%sales_ratio%)."
        CLOSING_REVIEW:
            title: "Bilan de la période"
            text: "Ventes %revenue%, marge %gross_margin%, résultat net %net_result%."
        LESSON_STOCKOUT:
            title: "Leçon : ruptures de stock"
            text: "%count% articles se sont vendus jusqu’à épuisement (%units_sold% ventes) : prévoyez-en davantage pour la même période l’an prochain."
        LESSON_OVERSTOCK:
            title: "Leçon : invendus"
            text: "%count% articles ne se sont pas vendus : %cost_value% restent immobilisés au coût. Achetez-en moins l’an prochain."
        LESSON_BUDGET:
            title: "Leçon : poste %category% dépassé"
            text: "Prévu %planned%, dépensé %actual% : prévoyez plus large, ou surveillez ce poste plus tôt l’an prochain."
        RENTAL_PEAK_DAYS:
            title: "%name% : jours pleins"
            text: "%name% est loué à %occupancy% le %weekdays% (%rentals% locations en 8 semaines). Une hausse de %price_increase% ces jours-là rapporterait environ %effect% d’ici la fin de la période."
