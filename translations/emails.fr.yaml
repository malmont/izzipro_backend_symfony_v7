# Prévention des pertes (lot L1-b) : résumé du jour, envoyé aux administrateurs du site. Aucun nom, aucun détail d'un constat, aucun lien.
aid_reminder:
    subject: "{1}Aides : 1 point à vérifier|]1,Inf[Aides : %count% points à vérifier"
    title: 'Vos aides'
    greeting: 'Bonjour,'
    message: "{1}1 point de vos aides demande votre attention.|]1,Inf[%count% points de vos aides demandent votre attention."
    row_condition: '%aid% : la condition « %condition% » est arrivée à échéance le %date%.'
    row_documents: '%aid% : reçue, sans justificatif rattaché.'
    more: "{1}Et 1 autre point.|]1,Inf[Et %count% autres points."
    next: 'Ouvrez l''écran « Aides » de votre application de gestion : marquez chaque condition tenue ou non tenue, et rattachez les justificatifs.'
    notice: 'Chaque point n''est rappelé qu''une fois. Vous pouvez arrêter ce courriel dans les préférences de notification de la gestion.'
    link: 'Ouvrir les aides'
loss_digest:
    subject: "{1}Prévention des pertes : 1 nouveau constat à vérifier|]1,Inf[Prévention des pertes : %count% nouveaux constats à vérifier"
    title: 'Prévention des pertes'
    greeting: 'Bonjour,'
    message: "{1}1 nouveau constat attend votre vérification, pour un montant en jeu de %amount%.|]1,Inf[%count% nouveaux constats attendent votre vérification, pour un montant en jeu de %amount%."
    message_no_amount: "{1}1 nouveau constat attend votre vérification.|]1,Inf[%count% nouveaux constats attendent votre vérification."
    row_count: 'Nouveaux constats'
    row_renewed: 'Dont complétés par une nouvelle preuve'
    row_amount: 'Montant en jeu'
    message_renewed: "{1}Parmi eux, 1 constat plus ancien, complété par une nouvelle preuve.|]1,Inf[Parmi eux, %count% constats plus anciens, complétés par une nouvelle preuve."
    row_grown: 'Dont grossis depuis votre décision'
    message_grown: "{1}Parmi eux, 1 constat déjà décidé, qui a grossi depuis votre décision.|]1,Inf[Parmi eux, %count% constats déjà décidés, qui ont grossi depuis votre décision."
    row_day: 'Journée du magasin'
    next: 'Ouvrez la section « Prévention des pertes » de votre application de gestion pour lire leurs preuves et décider.'
    notice: 'Le montant en jeu est le montant concerné par les constats, pas une perte prouvée. Vous recevez ce courriel au plus une fois par jour ; vous pouvez l''arrêter dans les préférences de notification de la gestion.'
    signature: '%site%'
    link: 'Ouvrir les nouveaux constats'
    exercise_link: 'Ouvrir les exercices'
    exercise_subject: '[Exercice] %subject%'
    exercise_banner: 'EXERCICE : ce courriel montre l''alerte que vous recevriez pour un vrai constat. Le constat est fictif : il ne touche pas à la caisse et ne concerne aucune personne réelle.'
    evening_title: 'Le bilan d''hier'
    evening_day: 'Journée'
    evening_tracked: 'Articles suivis vendus'
    evening_unread: 'Dont vendus sans lecture'
    evening_exits: 'Sorties sans vente'
    evening_stockroom: 'Pièces sorties de la réserve'
    evening_unseen: 'Pièces non vues depuis %days% jours'
    evening_missing: 'Pièces absentes au comptage'
    evening_down: 'Appareils tombés dans la journée'
    evening_counter_shown: 'Alertes montrées en caisse'
    evening_counter_proceeded: 'Dont « continuer quand même »'

# Lot L6-b (17/11/2026) : un boîtier vendu par la plateforme est branché dans la boutique (indispensable). %serial% : son numéro de série ;
