    title: 'Le code de votre boîtier'
    greeting: 'Bonjour,'
    message: 'Votre boîtier %serial% est en route. Son code : %code%. Gardez ce code : il sert si votre boîtier n''est pas reconnu au branchement (« Boîtiers », « Ajouter un boîtier »). Ne le communiquez à personne.'
