# Lot AG-ASSIST (16/11/2026) : un commerçant demande l'assistance de l'agence qui gère son site, pour une section. Classé indispensable.
# %site% : le site ; %agency% : l'agence ; %section% : la section ; %who% : la personne qui demande ; %number% : le numéro de l'assistance.
assistance_request:
    subject: '%site% : demande d''assistance (%section%)'
    title: 'Demande d''assistance'
    greeting: 'Bonjour,'
    message_read: '%who% demande l''assistance de %agency% sur le site %site%, section « %section% », en CONSULTATION SEULEMENT (assistance n° %number%). Entrez dans le site depuis « Tous mes clients » : la section vous sera ouverte en lecture pendant une heure à partir de votre première entrée.'
    message_write: '%who% demande l''assistance de %agency% sur le site %site%, section « %section% », en CONSULTATION ET MODIFICATION (assistance n° %number%). Entrez dans le site depuis « Tous mes clients » : la section vous sera ouverte pendant une heure à partir de votre première entrée ; chaque modification sera tracée à votre nom.'
    button: 'Ouvrir « Tous mes clients »'
    validity: 'Sans entrée dans les 24 heures, la demande expire. Le commerçant peut fermer l''assistance à tout moment, et voit chaque écran consulté.'
    ignore: 'Pendant l''assistance, les clés, Stripe, le courriel expéditeur, les comptes et les exports restent fermés, et aucun paiement, remboursement ni encaissement ne peut être fait.'
group_invitation:
    subject: '%site% : invitation à rejoindre le groupe %group%'
    title: 'Invitation à rejoindre un groupe'
    greeting: 'Bonjour,'
    message: 'Le groupe « %group% » (siège : %head%) invite votre boutique %site% à le rejoindre. %consent% Pour accepter ou refuser, ouvrez votre espace d''administration : la demande vous attend dans l''onglet « Groupe ».'
    validity: 'L''invitation vaut %days% jours. Sans réponse, elle expire.'
    ignore: 'Si vous ne connaissez pas ce groupe, refusez l''invitation ou ignorez ce message : rien ne change sans votre accord.'

group_same_company:
    requested:
        subject: '%site% : le groupe %group% demande le lien « même entreprise »'
        title: 'Lien « même entreprise » demandé'
        greeting: 'Bonjour,'
        message: 'Le directeur du groupe « %group% » (siège : %head%) demande que votre boutique %site% soit déclarée de la même entreprise que le siège. %consent% Pour confirmer ou refuser, ouvrez votre espace d''administration : la demande vous attend dans l''écran « Multi-boutiques ».'
        validity: 'La demande vaut %days% jours. Sans réponse, elle expire et rien ne change.'
        ignore: 'Si votre boutique n''appartient pas à la même entreprise que ce siège, refusez la demande : rien ne change sans votre accord.'
    confirmed:
        subject: '%site% a confirmé le lien « même entreprise »'
        title: 'Lien « même entreprise » confirmé'
        greeting: 'Bonjour,'
        message: 'L''administrateur de la boutique %site% a confirmé qu''elle appartient à la même entreprise que le siège du groupe « %group% ». Le transfert de stock et la copie du coût d''achat vers cette boutique sont permis.'
        validity: 'La boutique peut retirer ce lien à tout moment ; vous en serez prévenu.'
        ignore: 'Ce message suit une demande faite depuis le siège du groupe.'
    refused:
        subject: '%site% a refusé le lien « même entreprise »'
        title: 'Lien « même entreprise » refusé'
        greeting: 'Bonjour,'
        message: 'L''administrateur de la boutique %site% a refusé de la déclarer de la même entreprise que le siège du groupe « %group% ». Elle reste une boutique associée : ni transfert de stock, ni copie du coût d''achat.'
        validity: 'Vous pourrez renouveler la demande plus tard.'
        ignore: 'Ce message suit une demande faite depuis le siège du groupe.'
    removed_by_shop:
        subject: '%site% a retiré le lien « même entreprise »'
        title: 'Lien « même entreprise » retiré par la boutique'
        greeting: 'Bonjour,'
        message: 'L''administrateur de la boutique %site% a retiré le lien « même entreprise » avec le siège du groupe « %group% ». Dès maintenant : plus de nouveau transfert de stock, et les copies vers cette boutique partent sans le coût d''achat. Un transfert déjà envoyé se termine normalement.'
        validity: 'Le retrait vaut tout de suite.'
        ignore: 'La boutique reste dans le groupe, comme boutique associée.'
    removed_by_head:
        subject: '%site% : le groupe %group% a retiré le lien « même entreprise »'
        title: 'Lien « même entreprise » retiré par le siège'
        greeting: 'Bonjour,'
        message: 'Le directeur du groupe « %group% » a retiré le lien « même entreprise » avec votre boutique %site%. Dès maintenant : plus de nouveau transfert de stock vers ou depuis votre boutique, et les copies arrivent sans le coût d''achat.'
        validity: 'Le retrait vaut tout de suite.'
        ignore: 'Votre boutique reste dans le groupe, comme boutique associée.'
    set_at_accept:
        subject: '%site% a rejoint le groupe %group% comme « même entreprise »'
        title: 'Lien « même entreprise » posé à l''acceptation'
        greeting: 'Bonjour,'
        message: 'L''administrateur de la boutique %site% a accepté l''invitation du groupe « %group% » et a déclaré qu''elle appartient à la même entreprise que le siège. Le transfert de stock et la copie du coût d''achat vers cette boutique sont permis.'
        validity: 'La boutique peut retirer ce lien à tout moment ; vous en serez prévenu.'
        ignore: 'Ce message suit l''acceptation de votre invitation par la boutique.'

group_transfer:
    requested:
        subject: '%site% : un transfert vers %target% attend votre envoi'
        title: 'Transfert à envoyer'
        greeting: 'Bonjour,'
        message: 'Le directeur du groupe « %group% » demande que votre boutique %site% envoie %count% ligne(s) d''articles à la boutique %target%. Préparez la marchandise, puis confirmez l''envoi dans votre espace d''administration : le stock ne sort qu''à ce moment.'
        validity: 'Le directeur peut annuler la demande tant qu''elle n''est pas reçue.'
        ignore: 'Rien ne bouge dans votre stock sans votre confirmation d''envoi.'
    sent:
        subject: '%site% : un transfert de %source% est en route'
        title: 'Transfert en route'
        greeting: 'Bonjour,'
        message: 'La boutique %source% (groupe « %group% ») vous a envoyé %count% ligne(s) d''articles. Une commande fournisseur « Transfert depuis %source% » est en route dans votre gestion : réceptionnez-la comme d''habitude à l''arrivée de la marchandise.'
        validity: 'Le stock n''entre chez vous qu''à la réception.'
        ignore: 'Ce message suit un transfert décidé par le directeur du groupe.'
    send_failed:
        subject: 'Groupe %group% : l''envoi d''un transfert de %site% n''a pas abouti'
        title: 'Envoi de transfert en échec'
        greeting: 'Bonjour,'
        message: 'L''envoi du transfert de la boutique %site% vers %target% n''a pas pu aboutir : la boutique de destination n''a pas accepté la commande. Le stock est revenu chez %site%. L''administrateur de %site% peut renvoyer, ou vous pouvez annuler le transfert.'
        validity: 'L''équipe technique de la plateforme est prévenue.'
        ignore: 'Aucune marchandise n''a été sortie du stock.'

