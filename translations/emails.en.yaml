# Customer emails in English (03/11/2026, mobile shop app lot L6b). French counterpart: emails.fr.yaml. Domain `emails`.
otp:
    subject: 'Your verification code'
    subject_platform: 'Your login code'
    title: 'Account verification'
    greeting: 'Hello,'
    code_is: 'Your verification code is:'
    expires: 'This code will expire in %minutes% minutes.'
    contact: 'For any question, contact us:'
    email_label: 'Email:'
    phone_label: 'Phone:'
verification:
    subject: 'Please confirm your email address'
    subject_resend: 'New account validation link'
    title: 'Please confirm your email address'
    greeting: 'Hello %name%!'
    intro: 'Thank you for signing up. To activate your account, please click the link below:'
    link: 'Validate my account'
    ignore: 'If you did not request this registration, please ignore this email.'
reset:
    subject: 'Reset your password'
    title: 'Password reset'
    greeting: 'Hello %name%!'
    requested: 'You requested a password reset.'
    click: 'Click the link below to create a new password:'
    button: 'Reset my password'
    expires: 'This link will expire in 1 hour.'
email_changed:
    subject: 'Your email address has been changed'
    greeting: 'Hello %name%,'
    body: 'The email address of your account was replaced on %date%: the former address <strong>%old%</strong> will no longer receive messages about your account, which will now go to <strong>%new%</strong>.'
    nothing_to_do: 'If you made this change, there is nothing you need to do.'
    not_you: 'If you did not request this change, reply to this message or contact us right away: we can restore your address.'
account_deleted:
    subject: 'Your account has been deleted'
    greeting: 'Hello %name%,'
    body: 'At your request, your account linked to the address <strong>%email%</strong> was deleted on %date%.'
    erased: 'Your personal data (name, addresses, phone number, email address) has been erased. Only your orders and payments are kept, anonymized, for accounting purposes, as required by law.'
    not_you: 'If you did not make this request, reply to this message or contact us right away.'
order:
    subject: 'Confirmation of your order no. %reference%'
    title: 'Confirmation of your order no. %reference%'
    thanks: 'Thank you for your order, %name%!'
    recorded: 'Your order no. <strong>%reference%</strong> has been recorded.'
    details: 'Order details'
    booking: '📅 Booking: %start% to %end%'
    subtotal_incl: 'Subtotal (tax incl.):'
    subtotal: 'Subtotal:'
    shipping: 'Shipping:'
    tax_included: 'of which taxes:'
    taxes: 'Taxes:'
    total: 'Total:'
    shipping_address: 'Shipping address'
    billing_address: 'Billing address'
    phone: 'Tel:'
    no_address: 'Address not available.'
    size: 'Size'
    color: 'Color'
