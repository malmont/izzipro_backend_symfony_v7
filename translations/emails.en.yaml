# Chapter e-mail invitations, Mémoires Vivantes (2026-11-08): link sent, resent, renewed; notice to the owner; unsubscribe
chapter_invitation:
    subject: '“%book%”: your memories are waiting'
    title: 'Your memories are waiting'
    greeting: 'Hello %name%,'
    greeting_anonymous: 'Hello,'
    default_owner: 'Your biographer'
    first: '%owner% invites you to answer the questions of the chapter “%chapter%” of the book “%book%”.'
    resend: '%owner% is sending you a new link for the chapter “%chapter%” of the book “%book%”.'
    renewal: 'Your previous link for the chapter “%chapter%” of the book “%book%” is no longer active. Here is a new one.'
    button: 'Answer the questions'
    valid_until: 'This link is valid until %date%.'
    auto_renew: 'If you have not finished by then, a new link will be sent to you automatically.'
    last_renewal: 'This is the last link sent automatically: after it, ask %owner% for a new one.'
    done_hint: 'When you are done, click “Finish and save”: you will not receive any more reminders.'
    link_fallback: 'If the button does not work, copy this address into your browser:'
    unsubscribe: 'You no longer wish to receive these e-mails? <a href="%url%" style="color: #94a3b8;">Click here</a>.'
    exhausted_subject: 'Invitation left unanswered: “%chapter%”'
    exhausted_title: 'An invitation was left unanswered'
    exhausted_body: 'The link sent to <strong>%email%</strong>%name% for the chapter “%chapter%” of the book “%book%” expired after %count% automatic renewals, without the answers being completed.'
    exhausted_action: 'From your book, you can send a new link or check the address.'
    exhausted_button: 'Open my books'
    unsubscribed_title: 'You will no longer receive these e-mails'
    unsubscribed_body: 'No more links will be sent to %email% for the books of this site.'
    unsubscribe_invalid_title: 'Invalid link'
    unsubscribe_invalid_body: 'This unsubscribe link is not valid or has already been used.'

# Support, batch 1 (2026-11-12): agent reply to the customer
support_reply:
    subject: 'Your request %reference%: %subject%'
    greeting: 'Hello %name%,'
    footer: 'Your request reference: %reference%. Reply to this email to add to it.'

# Loss prevention (lot L1-b): daily summary sent to the site administrators. No name, no detail of a finding, no link.
loss_digest:
    subject: "{1}Loss prevention: 1 new finding to check|]1,Inf[Loss prevention: %count% new findings to check"
    title: 'Loss prevention'
    greeting: 'Hello,'
    message: "{1}1 new finding is waiting for you to check, for an amount at stake of %amount%.|]1,Inf[%count% new findings are waiting for you to check, for an amount at stake of %amount%."
    message_no_amount: "{1}1 new finding is waiting for you to check.|]1,Inf[%count% new findings are waiting for you to check."
    row_count: 'New findings'
    row_renewed: 'Of which completed by new evidence'
    row_amount: 'Amount at stake'
    message_renewed: "{1}Among them, 1 older finding, completed by new evidence.|]1,Inf[Among them, %count% older findings, completed by new evidence."
    row_grown: 'Of which grew since your decision'
    message_grown: "{1}Among them, 1 finding already decided, which grew since your decision.|]1,Inf[Among them, %count% findings already decided, which grew since your decision."
    row_day: 'Shop day'
    next: 'Open the “Loss prevention” section of your management app to read their evidence and decide.'
    notice: 'The amount at stake is the amount the findings are about, not a proven loss. You receive this email at most once a day; you can stop it in the notification preferences of the management app.'
    signature: '%site%'
    link: 'Open the new findings'
    exercise_link: 'Open Practice'
    exercise_subject: '[Exercise] %subject%'
    exercise_banner: 'EXERCISE: this email shows the alert you would receive for a real finding. The finding is fictitious: it does not touch the register and concerns no real person.'
    evening_title: 'Yesterday''s summary'
    evening_day: 'Day'
    evening_tracked: 'Tracked items sold'
    evening_unread: 'Of which sold without a read'
    evening_exits: 'Exits without a sale'
    evening_stockroom: 'Pieces that left the stockroom'
    evening_unseen: 'Pieces not seen for %days% days'
    evening_missing: 'Pieces missing at the count'
    evening_down: 'Devices that went down during the day'
    evening_counter_shown: 'Alerts shown at the till'
    evening_counter_proceeded: 'Of which "continue anyway"'

# Lot L6-b (17/11/2026): a box sold by the platform is plugged in at the shop (indispensable). %serial%: its serial number; %site%:
# the site's name. Never the label code.
loss_box_code:
    subject: '%site%: the code of your box'
    title: 'The code of your box'
    greeting: 'Hello,'
    message: 'Your box %serial% is on its way. Its code: %code%. Keep this code: it is used if your box is not recognized when plugged in ("Boxes", "Add a box"). Do not share it with anyone.'
    validity: 'This code only links THIS box to your site, and to no other.'
    ignore: 'If you did not buy a box, ignore this e-mail and contact us.'

loss_box_cancelled:
    subject: '%site%: the shipment of your box is cancelled'
    title: 'Box shipment cancelled'
    greeting: 'Hello,'
    message: 'The platform cancelled the shipment of box %serial%, plugged in at your shop. Do not confirm it: it is no longer to be linked to your site.'
    button: 'Open the Boxes screen'
    validity: 'A question about this box? Reply to this e-mail or contact us.'
    ignore: 'Nothing was changed in your site.'

group_catalog_copied:
    subject: '{1}%site%: 1 item copied into your catalogue|]1,Inf[%site%: %count% items copied into your catalogue'
    title: 'Items copied into your catalogue'
    greeting: 'Hello,'
    message: 'The director of the group %group% copied items (%count%) into your shop''s catalogue. They are hidden: neither online nor at the till until you publish them. Stock is not copied.'
    message_visible: 'The director of the group %group% copied items (%count%) into your shop''s catalogue and chose to publish them as in the original shop. Stock is not copied.'
    button: 'Open your imports'
    validity: 'You can cancel this copy for 7 days from your imports: items nothing uses are removed.'
    ignore: 'If you do not know this group, contact us.'

loss_box_plugged:
    subject: '%site%: your box is plugged in'
    title: 'Your box is plugged in'
    greeting: 'Hello,'
    message: 'Box %serial%, which you bought, has just been plugged in at your shop. Check that this number is the one written on your box, then open the "Boxes" screen and confirm "This is my box" within 72 hours: it will link to your site.'
    button: 'Open the Boxes screen'
    validity: 'After 72 hours without confirmation, the box waits for a new plug-in.'
    ignore: 'If you did not plug in a box, do not confirm and contact us.'

# Support, SUPPORT-WEB: an agent invited by the site administrator (a single-use link, valid for %hours% hours)
support_agent_invitation:
    subject: '%site%: your access to customer support'
    title: 'Your access to customer support'
    greeting: 'Hello %name%,'
    message: '%inviter% invites you to answer the customer requests of %site%. Choose your password to open your access.'
    button: 'Choose my password'
    validity: 'This link works once and stays valid for %hours% hours. After that, ask for a new invitation.'
    ignore: 'If you were not expecting this invitation, ignore this e-mail: no access is opened until the password is chosen.'

# AG-2 (2026-11-15): the administrator of a site created by an agency chooses a password. %agency%: the agency's name; %site%: the
# site's name; %days%: how long the link lasts. greeting_plain: when the agency gave no first name.
site_admin_invitation:
    subject: '%site%: your administrator access'
    title: 'Your site is ready'
    greeting: 'Hello %name%,'
    greeting_plain: 'Hello,'
    message: '%agency% created the site %site% for you and entrusts you with its administration. Choose your password to open your administration space.'
    message_platform: 'The site %site% was created for you and you are entrusted with its administration. Choose your password to open your administration space.'
    validity_platform: 'This link works once and stays valid for %days% days. After that, ask the person who created your site for a new one.'
    button: 'Choose my password'
    validity: 'This link works once and stays valid for %days% days. After that, ask %agency% for a new link.'
    ignore: 'If you were not expecting this e-mail, ignore it: no access is opened until the password is chosen.'

# IMP-2 (2026-11-15): invitation of a customer carried over from the file of a former store. A single e-mail, decided by the merchant,
# never repeated; sober, with NO promotion at all (text validated by the owner). %expires%: end of validity of the link; %erase%: day on
# which the carried-over information is erased if the customer does nothing.
customer_import_invitation:
    subject: '%site%: your customer account'
    title: 'Your customer account'
    greeting: 'Hello %name%,'
    greeting_plain: 'Hello,'
    message: '%site% has moved its online store to a new site. You had a customer account on the old site: we can reopen it on the new one, if you wish.'
    button: 'Reopen my account'
    after_button: 'You will choose a password and read the terms of use before accepting.'
    validity: 'This link is valid until %expires%. If you do nothing, no account will be opened, and the information carried over from the old site (your name, your e-mail address, your postal address) will be erased on %erase% at the latest.'
    decline_intro: 'You can also have it erased right now:'
    decline_label: 'Do not reopen my account'
    once: 'You will not receive any other message about this.'

# NOTIF-1 (2026-11-15): held follow-up e-mails, gathered into one per topic
notification_summary:
    subject:
        orders: '%site%: %count% order(s) to ship'
        bookings: '%site%: %count% booking(s) to review'
        payments: '%site%: %count% update(s) about your payments'
        loss: '%site%: %count% update(s) in loss prevention'
        support: '%site%: %count% update(s) in support'
        entitlements: '%site%: %count% update(s) about your features'
        management: '%site%: %count% management update(s)'
        general: '%site%: %count% update(s) to see'
    title: 'Since your last e-mail'
    intro: 'Here is what happened since your last e-mail on this topic:'
    more: 'and %count% more, to read in your admin space.'
    button: 'Open my admin space'
    why: 'You receive at most one e-mail per day and per topic. You can change this in "Notifications".'

weekly_digest:
    held_title: 'This week''s follow-up emails'
    held_more: 'and %count% more, to read in your administration space.'
    held_why: 'At the "Essential" level, follow-up emails are not sent one by one: they are gathered here every Monday. You can change this setting in "Notifications".'

# AG-ASSIST lot (16/11/2026): a merchant asks the agency that manages their site for help with one section. Indispensable.
assistance_request:
    subject: '%site%: support request (%section%)'
    title: 'Support request'
    greeting: 'Hello,'
    message_read: '%who% asks %agency% for support on the site %site%, section "%section%", VIEW ONLY (support no. %number%). Enter the site from "All my clients": the section will be open to you, read only, for one hour from your first entry.'
    message_write: '%who% asks %agency% for support on the site %site%, section "%section%", VIEW AND EDIT (support no. %number%). Enter the site from "All my clients": the section will be open to you for one hour from your first entry; every change will be recorded under your name.'
    button: 'Open "All my clients"'
    validity: 'Without an entry within 24 hours, the request expires. The merchant can close the support at any time and sees every screen viewed.'
    ignore: 'During support, keys, Stripe, the sender email, accounts and exports stay closed, and no payment, refund or cash collection can be made.'
group_invitation:
    subject: '%site%: invitation to join the group %group%'
    title: 'Invitation to join a group'
    greeting: 'Hello,'
    message: 'The group "%group%" (head: %head%) invites your shop %site% to join it. %consent% To accept or refuse, open your administration space: the request is waiting in the "Group" tab.'
    validity: 'The invitation is valid for %days% days. Without an answer, it expires.'
    ignore: 'If you do not know this group, refuse the invitation or ignore this message: nothing changes without your consent.'

group_same_company:
    requested:
        subject: '%site%: the group %group% asks for the "same company" link'
        title: '"Same company" link requested'
        greeting: 'Hello,'
        message: 'The director of the group "%group%" (head: %head%) asks that your shop %site% be declared part of the same company as the head. %consent% To confirm or refuse, open your administration space: the request is waiting in the "Multi-shop" screen.'
        validity: 'The request is valid for %days% days. Without an answer, it expires and nothing changes.'
        ignore: 'If your shop does not belong to the same company as this head, refuse the request: nothing changes without your consent.'
    confirmed:
        subject: '%site% confirmed the "same company" link'
        title: '"Same company" link confirmed'
        greeting: 'Hello,'
        message: 'The administrator of the shop %site% confirmed that it belongs to the same company as the head of the group "%group%". Stock transfers and copying the purchase cost to this shop are allowed.'
        validity: 'The shop can remove this link at any time; you will be told.'
        ignore: 'This message follows a request made from the head of the group.'
    refused:
        subject: '%site% refused the "same company" link'
        title: '"Same company" link refused'
        greeting: 'Hello,'
        message: 'The administrator of the shop %site% refused to declare it part of the same company as the head of the group "%group%". It stays an associated shop: no stock transfer, no copy of the purchase cost.'
        validity: 'You can ask again later.'
        ignore: 'This message follows a request made from the head of the group.'
    removed_by_shop:
        subject: '%site% removed the "same company" link'
        title: '"Same company" link removed by the shop'
        greeting: 'Hello,'
        message: 'The administrator of the shop %site% removed the "same company" link with the head of the group "%group%". From now on: no new stock transfer, and copies to this shop go without the purchase cost. A transfer already sent ends normally.'
        validity: 'The removal applies immediately.'
        ignore: 'The shop stays in the group, as an associated shop.'
    removed_by_head:
        subject: '%site%: the group %group% removed the "same company" link'
        title: '"Same company" link removed by the head'
        greeting: 'Hello,'
        message: 'The director of the group "%group%" removed the "same company" link with your shop %site%. From now on: no new stock transfer to or from your shop, and copies arrive without the purchase cost.'
        validity: 'The removal applies immediately.'
        ignore: 'Your shop stays in the group, as an associated shop.'
    set_at_accept:
        subject: '%site% joined the group %group% as "same company"'
        title: '"Same company" link set at acceptance'
        greeting: 'Hello,'
        message: 'The administrator of the shop %site% accepted the invitation of the group "%group%" and declared that it belongs to the same company as the head. Stock transfers and copying the purchase cost to this shop are allowed.'
        validity: 'The shop can remove this link at any time; you will be told.'
        ignore: 'This message follows the acceptance of your invitation by the shop.'

group_transfer:
    requested:
        subject: '%site%: a transfer to %target% is waiting for your shipment'
        title: 'Transfer to send'
        greeting: 'Hello,'
        message: 'The director of the group "%group%" asks your shop %site% to send %count% line(s) of items to the shop %target%. Prepare the goods, then confirm the shipment in your administration space: stock leaves only at that moment.'
        validity: 'The director can cancel the request as long as it is not received.'
        ignore: 'Nothing moves in your stock without your shipment confirmation.'
    sent:
        subject: '%site%: a transfer from %source% is on its way'
        title: 'Transfer on its way'
        greeting: 'Hello,'
        message: 'The shop %source% (group "%group%") sent you %count% line(s) of items. A purchase order "Transfert depuis %source%" is on its way in your management app: receive it as usual when the goods arrive.'
        validity: 'Stock enters your shop only at reception.'
        ignore: 'This message follows a transfer decided by the director of the group.'
    send_failed:
        subject: 'Group %group%: the shipment of a transfer from %site% failed'
        title: 'Transfer shipment failed'
        greeting: 'Hello,'
        message: 'The shipment of the transfer from the shop %site% to %target% could not complete: the destination shop did not accept the order. The stock went back to %site%. The administrator of %site% can send again, or you can cancel the transfer.'
        validity: 'The platform technical team is told.'
        ignore: 'No goods left the stock.'

bug_report_answer:
    subject: 'Your report no. %id%: %status%'
    title: 'Your report'
    greeting: 'Hello,'
    message: 'The technical team has handled your report no. %id%. Status: %status%.'
    answer: 'Their answer:'
    where: 'You can find your reports under “My reports” in your application.'
    status:
        received: 'received'
        in_progress: 'in progress'
        fixed: 'fixed'
        wont_fix: 'will not be fixed'

# Lot ABO-3b (20/11/2026): a subscription staff member is invited by the site administrator. %site%, %inviter%, %days%
abo_staff_invitation:
    subject: '%site%: your staff access'
    title: 'Your staff access'
    greeting: 'Hello %name%,'
    message: '%inviter% invites you to follow your subscription appointments and sessions at %site%: your dates for today and the week, "done" or "absent". Choose your password to open your access.'
    button: 'Choose my password'
    validity: 'This link works once and stays valid for %days% days. After that, ask for a new invitation.'
