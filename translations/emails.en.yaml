# Customer emails in English (03/11/2026, mobile shop app lot L6b). French counterpart: emails.fr.yaml. Domain `emails`.
otp:
    subject: 'Your verification code'
    subject_platform: 'Your login code'
    title: 'Account verification'
    greeting: 'Hello,'
    code_is: 'Your verification code is:'
    expires: 'This code will expire in %minutes% minutes.'
    contact: 'For any question, contact us:'
    email_label: 'Email:'
    phone_label: 'Phone:'
verification:
    subject: 'Please confirm your email address'
    subject_resend: 'New account validation link'
    title: 'Please confirm your email address'
    greeting: 'Hello %name%!'
    intro: 'Thank you for signing up. To activate your account, please click the link below:'
    link: 'Validate my account'
    ignore: 'If you did not request this registration, please ignore this email.'
reset:
    subject: 'Reset your password'
    title: 'Password reset'
    greeting: 'Hello %name%!'
    requested: 'You requested a password reset.'
    click: 'Click the link below to create a new password:'
    button: 'Reset my password'
    expires: 'This link will expire in 1 hour.'
email_changed:
    subject: 'Your email address has been changed'
    greeting: 'Hello %name%,'
    body: 'The email address of your account was replaced on %date%: the former address <strong>%old%</strong> will no longer receive messages about your account, which will now go to <strong>%new%</strong>.'
    nothing_to_do: 'If you made this change, there is nothing you need to do.'
    not_you: 'If you did not request this change, reply to this message or contact us right away: we can restore your address.'
account_deleted:
    subject: 'Your account has been deleted'
    greeting: 'Hello %name%,'
    body: 'At your request, your account linked to the address <strong>%email%</strong> was deleted on %date%.'
    erased: 'Your personal data (name, addresses, phone number, email address) has been erased. Only your orders and payments are kept, anonymized, for accounting purposes, as required by law.'
    not_you: 'If you did not make this request, reply to this message or contact us right away.'
order:
    subject: 'Confirmation of your order no. %reference%'
    title: 'Confirmation of your order no. %reference%'
    thanks: 'Thank you for your order, %name%!'
    recorded: 'Your order no. <strong>%reference%</strong> has been recorded.'
    details: 'Order details'
    booking: '📅 Booking: %start% to %end%'
    subtotal_incl: 'Subtotal (tax incl.):'
    subtotal: 'Subtotal:'
    shipping: 'Shipping:'
    tax_included: 'of which taxes:'
    taxes: 'Taxes:'
    total: 'Total:'
    shipping_address: 'Shipping address'
    billing_address: 'Billing address'
    phone: 'Tel:'
    no_address: 'Address not available.'
    size: 'Size'
    color: 'Color'
# Platform entitlements (steering console, lot 3, 2026-11-04): emails to the site contact
entitlement:
    greeting: 'Hello %site%,'
    signature: 'The Arkanoa platform'
    row_feature: 'Feature'
    row_ends_at: 'Ends on'
    row_grace_until: 'Suspension scheduled on'
    subject_granted: 'Your %feature% feature is now active'
    title_granted: 'Feature activated'
    message_granted: 'The %feature% feature is now active on your site.'
    next_granted: 'You can configure it from your administration, page "My site".'
    subject_trial_started: 'Your %feature% trial has started'
    title_trial_started: 'Free trial started'
    message_trial_started: 'Your free trial of the %feature% feature starts today and ends on %date%.'
    next_trial_started: 'To keep it after the trial, subscribe from your administration, page "My site", or write to us.'
    subject_expiring_7: 'Your %feature% trial ends in 7 days'
    title_expiring_7: 'Trial ends in 7 days'
    message_expiring_7: 'Your free trial of the %feature% feature ends on %date%.'
    next_expiring_7: 'To keep the feature, subscribe before that date from your administration, page "My site".'
    subject_expiring_1: 'Your %feature% trial ends tomorrow'
    title_expiring_1: 'Trial ends tomorrow'
    message_expiring_1: 'Your free trial of the %feature% feature ends on %date%.'
    next_expiring_1: 'After that date the feature will be disabled on your site; your data is kept.'
    subject_expired: 'Your access to %feature% has ended'
    title_expired: 'Access ended'
    message_expired: 'Your access to the %feature% feature has ended: it is now disabled on your site. Your data is kept.'
    next_expired: 'To reactivate it, subscribe from your administration, page "My site", or write to us.'
    subject_grace: 'Payment pending for %feature%'
    title_grace: 'Payment pending'
    message_grace: 'The latest payment for your %feature% subscription did not go through. The feature stays active until %date%.'
    next_grace: 'Update your payment method before that date to avoid suspension.'
    subject_suspended: 'Your %feature% feature is suspended'
    title_suspended: 'Feature suspended'
    message_suspended: 'The %feature% feature is suspended on your site. Your data is kept.'
    next_suspended: 'To restore it, settle your subscription or write to us.'
    subject_resumed: 'Your %feature% feature is back'
    title_resumed: 'Feature restored'
    message_resumed: 'The %feature% feature is active again on your site.'
    next_resumed: 'Thank you for your trust.'
