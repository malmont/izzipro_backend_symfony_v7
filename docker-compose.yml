version: '3.8'

services:
  # Symfony (PHP)
  app:
    image: ghcr.io/malmont/symfony-backend:latest
    container_name: symfony_app
    working_dir: /var/www
    env_file:
      - .env
    networks:
      internal_symfony:
        aliases:
          - symfony_app
      web: # Permet à Traefik de trouver ce service
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  # PostgreSQL
  db:
    image: postgres:15
    container_name: symfony_db
    restart: always
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      internal_symfony:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx
  nginx:
    extends:
      file: ./label/labels.yml
      service: nginx
    image: ghcr.io/malmont/symfony-nginx:latest
    container_name: symfony_nginx
    networks:
      internal_symfony:
      web: # Permet à Traefik de trouver ce service
    restart: always

  # Traefik (Reverse Proxy + SSL)
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./letsencrypt:/letsencrypt
      - ./traefik/traefik.yml:/traefik.yml
    networks:
      web:

volumes:
  db_data:
  var_cache:
  var_log:

networks:
  internal_symfony:
    driver: bridge  # Réseau interne pour Symfony (Nginx, PHP-FPM, PostgreSQL)
  web:
    external: true  # Réseau externe pour Traefik
