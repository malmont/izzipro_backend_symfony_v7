version: '3.8'

services:
  # Symfony (PHP)
  app:
    build:
      context: /home/${{ secrets.CLIENT1_SERVER_USER }}/app  # Remplacement de ${USER}
      dockerfile: Dockerfile
    container_name: symfony_app
    working_dir: /home/app
    env_file:
      - /home/${{ secrets.CLIENT1_SERVER_USER }}/app/.env  # Correction du chemin
    volumes:
      - /home/${{ secrets.CLIENT1_SERVER_USER }}/app/src:/home/app
      - /home/${{ secrets.CLIENT1_SERVER_USER }}/app/.env:/home/app/.env  # Montage explicite du fichier .env
    networks:
      - symfony
    depends_on:
      - db

  # PostgreSQL
  db:
    image: postgres:15
    container_name: symfony_db
    restart: always
    env_file:
      - /home/${{ secrets.CLIENT1_SERVER_USER }}/app/.env  # Correction du chemin
    volumes:
      - db_data:/var/lib/postgresql/data
      - /home/${{ secrets.CLIENT1_SERVER_USER }}/app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - symfony

  # Nginx
  nginx:
    image: nginx:latest
    container_name: symfony_nginx
    ports:
      - "80:80"
    volumes:
      - /home/${{ secrets.CLIENT1_SERVER_USER }}/app/src:/home/app
      - /home/${{ secrets.CLIENT1_SERVER_USER }}/app/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - symfony

volumes:
  db_data:

networks:
  symfony:
