version: '3.8'

services:
  # Symfony (PHP)
  app:
    build:
      context: /home/${USER}/app
      dockerfile: Dockerfile
    container_name: symfony_app
    working_dir: /home/app
    env_file:
      - /home/app/.env
    volumes:
      - /home/${USER}/app/src:/home/app
    networks:
      - symfony
    depends_on:
      - db

  # PostgreSQL
  db:
    image: postgres:15
    container_name: symfony_db
    restart: always
    env_file:
      - /home/app/.env
    volumes:
      - db_data:/var/lib/postgresql/data
      - /home/${USER}/app/docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - symfony

  # Nginx
  nginx:
    image: nginx:latest
    container_name: symfony_nginx
    ports:
      - "80:80"
    volumes:
      - /home/${USER}/app/src:/home/app
      - /home/${USER}/app/docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - symfony

volumes:
  db_data:

networks:
  symfony:
