version: '3.8'

services:
  # Symfony (PHP)
  app:
    image: ghcr.io/${CLIENT1_GITHUB_REPOSITORY_OWNER}/symfony-backend:latest
    container_name: symfony_app
    volumes:
      - public_data:/var/www/public
      - ./jwt:/var/www/config/jwt
    working_dir: /var/www
    env_file:
      - .env
    networks:
      - symfony
    restart: always
    healthcheck:
      disable: true

  # PostgreSQL
  db:
    image: postgres:15
    container_name: symfony_db
    restart: always
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - symfony
    healthcheck:
      disable: true

  # Redis
  redis:
    image: redis:7
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - symfony
    volumes:
      - redis_data:/data

  # Symfony Nginx (Backend)
  nginx:
    image: ghcr.io/${CLIENT1_GITHUB_REPOSITORY_OWNER}/symfony-nginx:latest
    container_name: symfony_nginx
    volumes:
      - public_data:/var/www/public
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:rw
    networks:
      - symfony
    depends_on:
      - app
    restart: always

  # Caddy (Reverse Proxy + SSL)
  caddy:
    image: caddy:latest
    container_name: caddy_proxy
    ports:
      # --- MODIFICATION ICI ---
      # On utilise des ports libres pour éviter les conflits
      - "8080:80"
      - "8443:443"
      # --- FIN DE LA MODIFICATION ---
    volumes:
      # Chemin vers votre Caddyfile
      - ./caddyfile/Caddyfile:/etc/caddy/Caddyfile:ro
      # Ajout des certificats SSL locaux générés avec mkcert
      - ./64.187.182.48.pem:/etc/caddy/certs/64.187.182.48.pem:ro
      - ./64.187.182.48-key.pem:/etc/caddy/certs/64.187.182.48-key.pem:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - symfony
    depends_on:
      - nginx

volumes:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:
  public_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${CLIENT1_SERVER_USER}/app/public

networks:
  symfony:
    driver: bridge