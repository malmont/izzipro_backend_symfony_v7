version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symfony_app_v2
    volumes:
      - .:/var/www
      - ./jwt:/var/www/config/jwt
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    working_dir: /var/www
    env_file:
      - .env
    networks:
      - symfony_v2
    restart: always

  db:
    image: postgres:15
    container_name: symfony_db_v2
    restart: always
    env_file:
      - .env
    volumes:
      - db_data_v2:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - symfony_v2

  redis:
    image: redis:7
    container_name: redis_cache_v2
    restart: unless-stopped
    # Journal AOF : les files Messenger (rédactions en attente) survivent à un redémarrage de Redis. Sans lui, seul
    # l'instantané périodique (jusqu'à une heure d'écart) était conservé. Activé aussi à chaud le 30/09/2026.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    networks:
      - symfony_v2
    volumes:
      - redis_data_v2:/data

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: symfony_nginx_v2
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:rw
    networks:
      symfony_v2:
      web:
        ipv4_address: 172.18.0.5
    depends_on:
      - app
    restart: always

  # Workers Messenger : un par projet, chacun sur sa file (config/packages/messenger.yaml) et avec son propre cache
  # Symfony (docker/worker/consume.sh). Redémarrage automatique toutes les 15 minutes, entre deux messages, pour
  # reprendre le code à jour sans intervention.
  messenger_worker:
    &messenger_worker
    image: app_v2-app:latest
    container_name: symfony_messenger_worker_v2
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./jwt:/var/www/config/jwt
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    env_file:
      - .env
    environment:
      APP_CACHE_DIR: /tmp/symfony-worker-cache
      APP_DEBUG: "0"
    networks:
      - symfony_v2
    depends_on:
      - app
      - db
      - redis
    # Mémoires Vivantes (chapitres)
    command: ["sh", "docker/worker/consume.sh", "async", "--limit=50", "--time-limit=900", "--memory-limit=256M"]

  messenger_worker_esg:
    <<: *messenger_worker
    container_name: symfony_messenger_worker_esg_v2
    # Boussole ESG (rapports PDF)
    command: ["sh", "docker/worker/consume.sh", "esg", "--limit=50", "--time-limit=900", "--memory-limit=256M"]

  messenger_worker_landing:
    <<: *messenger_worker
    container_name: symfony_messenger_worker_landing_v2
    # Assistant IA des landing pages (mode page, images)
    command: ["sh", "docker/worker/consume.sh", "landing_ai", "--limit=50", "--time-limit=900", "--memory-limit=256M"]

  messenger_worker_media:
    <<: *messenger_worker
    # Image de l'application + ffmpeg (docker/worker-media/Dockerfile) : seul conteneur qui encode des vidéos
    image: app_v2-worker-media:latest
    build:
      context: docker/worker-media
    container_name: symfony_messenger_worker_media_v2
    # Médiathèque (vidéos préparées pour les scènes au défilement) : un encodage peut durer plusieurs minutes
    command: ["sh", "docker/worker/consume.sh", "media", "--limit=20", "--time-limit=900", "--memory-limit=256M"]

  messenger_worker_email:
    <<: *messenger_worker
    container_name: symfony_messenger_worker_email_v2
    # Courriels de tous les sites (09/10/2026) : la requête n'attend plus le serveur SMTP ; envois courts, nombreux
    command: ["sh", "docker/worker/consume.sh", "email", "--limit=500", "--time-limit=900", "--memory-limit=256M"]

volumes:
  db_data_v2:
  redis_data_v2:

networks:
  symfony_v2:
    driver: bridge
  web:
    external: true