version: '3.8'

services:
  # Symfony (PHP)
  app:
    image: ghcr.io/malmont/symfony-backend:latest
    container_name: symfony_app
    working_dir: /var/www
    env_file:
      - .env
    networks:
      - symfony
      - web
    restart: always
    healthcheck:
      disable: true

  # PostgreSQL
  db:
    image: postgres:15
    container_name: symfony_db
    restart: always
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - symfony
    healthcheck:
      disable: true


  # Nginx
  nginx:
    image: ghcr.io/malmont/symfony-nginx:latest
    container_name: symfony_nginx
    volumes:
      - ./public:/var/www/public
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:rw
    networks:
      - symfony
      - web
    depends_on:
      - app
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.symfony.rule=Host(`naowe-backend.store`)"
      - "traefik.http.routers.symfony.entrypoints=websecure"
      - "traefik.http.routers.symfony.tls.certresolver=letsencrypt"
      - "traefik.http.services.nginx.loadbalancer.server.port=80"


  # Traefik (Reverse Proxy + SSL)
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./letsencrypt:/letsencrypt
      - ./traefik/traefik.yml:/traefik.yml
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.naowe-backend.store`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.middlewares=secure-dashboard@file"
    depends_on:
      - nginx

volumes:
  db_data:
  var_cache:
  var_log:

networks:
  symfony:
  web:
    external: true