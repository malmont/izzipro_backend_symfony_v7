version: '3.8'

services:
  # Symfony (PHP)
  app:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/symfony-backend:latest
    container_name: symfony_app
    working_dir: /var/www
    env_file:
      - .env
    volumes:
      - var_cache:/var/www/var/cache   # ✅ Données dynamiques
      - var_log:/var/www/var/log       # ✅ Données dynamiques
    networks:
      - symfony
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  # PostgreSQL
  db:
    image: postgres:15
    container_name: symfony_db
    restart: always
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - symfony
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx
  nginx:
    image: nginx:latest
    container_name: symfony_nginx
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/public  # ✅ Nginx n'a besoin que de public
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      app:
        condition: service_healthy
    networks:
      - symfony
    restart: always

volumes:
  db_data:
  var_cache:
  var_log:

networks:
  symfony:
