version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symfony_app_v2
    volumes:
      - .:/var/www
      - ./jwt:/var/www/config/jwt
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    working_dir: /var/www
    env_file:
      - .env
    networks:
      - symfony_v2
    restart: always

  db:
    image: postgres:15
    container_name: symfony_db_v2
    restart: always
    env_file:
      - .env
    volumes:
      - db_data_v2:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - symfony_v2

  redis:
    image: redis:7
    container_name: redis_cache_v2
    restart: unless-stopped
    networks:
      - symfony_v2
    volumes:
      - redis_data_v2:/data

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: symfony_nginx_v2
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:rw
    networks:
      symfony_v2:
      web:
        ipv4_address: 172.18.0.5
    depends_on:
      - app
    restart: always

  messenger_worker:
    image: app_v2-app:latest
    container_name: symfony_messenger_worker_v2
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./jwt:/var/www/config/jwt
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    env_file:
      - .env
    networks:
      - symfony_v2
    depends_on:
      - app
      - db
      - redis
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M"]


volumes:
  db_data_v2:
  redis_data_v2:

networks:
  symfony_v2:
    driver: bridge
  web:
    external: true