version: '3.8'

services:
  # Symfony (PHP)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symfony_app
    working_dir: /var/www
    env_file:
      - .env  # ✅ Utilisation du fichier .env
    volumes:
      - ./src:/var/www  # ✅ Limite les montages pour ne pas écraser le .env
    networks:
      - symfony
    depends_on:
      - db

  # PostgreSQL
  db:
    image: postgres:15
    container_name: symfony_db
    restart: always
    env_file:
      - .env  # ✅ Reprise des variables d'environnement
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - symfony

  # Nginx
  nginx:
    image: nginx:latest
    container_name: symfony_nginx
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www  # ✅ Réduit le volume monté
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - symfony

volumes:
  db_data:

networks:
  symfony:
