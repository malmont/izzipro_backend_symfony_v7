version: '3.8'

services:
  # Symfony (PHP)
  app:
    image: ghcr.io/malmont/symfony-backend:latest
    container_name: symfony_app
    volumes:
      - public_data:/var/www/public
      - ./config/jwt:/var/www/config/jwt
    working_dir: /var/www
    env_file:
      - .env
    networks:
      - symfony
    restart: always
    healthcheck:
      disable: true

  # PostgreSQL
  db:
    image: postgres:15
    container_name: symfony_db
    restart: always
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - symfony
    healthcheck:
      disable: true

  # Symfony Nginx (Backend)
  nginx:
    image: ghcr.io/malmont/symfony-nginx:latest
    container_name: symfony_nginx
    volumes:
      - public_data:/var/www/public
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:rw
    networks:
      - symfony
    depends_on:
      - app
    restart: always

  # Caddy (Reverse Proxy + SSL)
  caddy:
    image: caddy:latest
    container_name: caddy_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddyfile/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - symfony
    depends_on:
      - nginx

volumes:
  db_data:
  caddy_data:
  caddy_config:
  public_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/malmont/app/public

networks:
  symfony:
    driver: bridge
