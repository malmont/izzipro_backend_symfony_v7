; php.ini de l'image (lot PHP84, 20/11/2026). Avant ce lot, l'image n'avait AUCUN php.ini : display_errors valait 1 et un
; script lancé hors du runtime de Symfony pouvait écrire un avis de PHP dans sa sortie, donc dans une réponse.
;
; Volontairement minimal : seulement les réglages d'affichage et de journal de php.ini-production, plus les limites
; d'avant reprises à l'identique. Tout le reste garde la valeur par défaut de PHP, comme avant (recopier tout
; php.ini-production changerait error_reporting, output_buffering, request_order, session.* et d'autres).
; Les fichiers de conf.d (image et montés par docker-compose.yml) sont lus APRÈS ce fichier et le complètent.

; --- erreurs : jamais affichées, toujours journalisées (sortie d'erreur : `docker logs`)
display_errors = Off
display_startup_errors = Off
log_errors = On
; error_log non posé : la sortie d'erreur du processus (CLI), le journal du maître FPM pour FPM (/proc/self/fd/2 dans
; l'image officielle), tous deux lus par `docker logs`

; --- en-tête X-Powered-By retiré (version exacte de PHP)
expose_php = Off

; --- limites d'avant, inchangées (relevées en ligne le 20/11/2026 ; aussi posées par conf.d, gardées ici pour une image
;     lancée sans les fichiers montés, cible Kubernetes)
memory_limit = -1
upload_max_filesize = 200M
post_max_size = 200M
max_execution_time = 600

; --- JIT : éteint, comme en 8.3 (tampon 0). PHP 8.4 change ses valeurs par défaut (opcache.jit=disable mais tampon de
;     64M réservé) : on garde le tampon à 0, aucune mémoire partagée réservée pour un JIT qui ne sert pas
opcache.jit_buffer_size = 0
