; Pool PHP-FPM (17/10/2026, performances), monté par docker-compose.yml après la configuration de l'image.
; 5 processus étaient atteints plusieurs fois par jour : une génération IA occupe un processus pendant des minutes.
; Mémoire : 60 à 90 Mo propres par processus, soit environ 2 Go au maximum sur 15 Go.
[global]
; Rechargement (kill -USR2 1) : laisse 30 s aux requêtes en cours au lieu de les couper
process_control_timeout = 30s

[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle chaque processus après 500 requêtes (memory_limit=-1 : borne les fuites de mémoire)
pm.max_requests = 500
; État du pool, interne seulement (nginx n'envoie à PHP que /index.php) :
; docker exec symfony_app_v2 sh -c 'SCRIPT_NAME=/fpm-status SCRIPT_FILENAME=/fpm-status REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000'
pm.status_path = /fpm-status
