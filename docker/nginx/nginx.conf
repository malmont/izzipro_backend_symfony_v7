user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ✅ Augmentation des buffers pour éviter l'écriture sur disque
    client_max_body_size 20M;            # Autorise des uploads plus volumineux
    fastcgi_buffers 16 16k;              # Augmente le nombre et la taille des buffers
    fastcgi_buffer_size 32k;             # Taille du buffer principal
    fastcgi_request_buffering off;       # Désactive le buffering des requêtes FastCGI

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # ✅ Traefik gère l'HTTPS, Nginx écoute sur HTTP (port interne)
    server {
        listen 80;
        server_name _;  # Le trafic interne ne dépend pas du nom de domaine

        root /var/www/public;
        index index.php index.html;

        # Gestion des fichiers et des requêtes PHP
        location / {
            try_files $uri /index.php$is_args$args;
        }

        # ✅ Servir correctement les assets d'EasyAdmin
        location /bundles/ {
            alias /var/www/public/bundles/;
            access_log off;
            expires 1y;
            add_header Cache-Control "public";
        }

        location ~ \.php$ {
            fastcgi_pass app:9000;  # Connecte Nginx à PHP-FPM
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Bloque les fichiers .htaccess
        location ~ /\.ht {
            deny all;
        }
    }
}
