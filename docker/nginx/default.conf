user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 2048;  # Augmenté pour mieux supporter le nombre de connexions simultanées
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Augmentation des buffers pour éviter l'écriture sur disque
    client_max_body_size 20M;            # Autorise des uploads plus volumineux
    fastcgi_buffers 16 16k;              # Nombre et taille des buffers pour FastCGI
    fastcgi_buffer_size 32k;             # Taille du buffer principal FastCGI
    fastcgi_request_buffering off;       # Désactive le buffering des requêtes FastCGI

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # --- BLOC SERVEUR SIMPLIFIÉ (POUR LE TEST HTTP) ---
    server {
        # Écoute sur le port 80 à l'intérieur du conteneur
        listen 80;
        listen [::]:80;
        server_name _;

        root /var/www/public;
        index index.php index.html;

        # Gestion des requêtes statiques et redirection vers index.php le cas échéant
        location / {
            try_files $uri /index.php$is_args$args;
        }

        # Servir correctement les assets d'EasyAdmin
        location /bundles/ {
            alias /var/www/public/bundles/;
            access_log off;
            expires 1y;
            add_header Cache-Control "public";
        }

        # Traitement des fichiers PHP par PHP-FPM
        location ~ \.php$ {
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 300s;
            fastcgi_read_timeout 300s;
        }

        # Interdire l'accès aux fichiers .ht (non utilisés par Nginx)
        location ~ /\.ht {
            deny all;
        }
    }
}
