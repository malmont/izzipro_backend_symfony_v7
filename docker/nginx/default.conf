# Fichier: lizipro/docker/nginx/default.conf

server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # On passe la requête au conteneur PHP-FPM qui écoute sur le port 9000
        # Nginx et PHP-FPM sont dans le même pod, ils peuvent donc se parler via localhost
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # On refuse l'accès direct aux fichiers .php
    location ~ \.php$ {
        return 404;
    }

    # On ajoute des logs pour le débogage
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}