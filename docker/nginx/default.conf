# Fichiers envoyés : un SVG ouvert directement ne doit pas pouvoir exécuter de script sur le domaine du backend
map $uri $upload_svg_csp {
    ~*\.svg$  "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; sandbox";
    default   "";
}

# Réponse d'erreur neutre selon la route : JSON pour l'API (les fronts affichent le message), HTML sinon.
# Réponses directes (return) et non fichiers statiques : nginx refuse de servir un fichier à un POST (405).
map $request_uri $error_5xx_location {
    ~^/api/  @error_5xx_api;
    default  @error_5xx_html;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 200M;

    root /var/www/public;
    index index.php;

    # =============================================
    # CORS — Multi-origin avec regex (Next.js local + domaines prod)
    # =============================================
    set $cors_origin "";

    if ($http_origin ~* "^https?://((.*\.)?arkanoa-media\.(com|ca|tech)|(www\.)?esgboost\.(ca|fr)|(www\.)?karaandb\.com|(.*\.)?memoiresvivantes\.com|(.*\.)?memoirevivante\.my|(.*\.)?memoiresvivantes\.my|(.*\.)?backend-strapi\.online|(.*\.)?lintendantprive\.com|(.*\.)?lintendant\.com|(.*\.)?localhost(:[0-9]+)?)$") {
        set $cors_origin $http_origin;
    }

    add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Origin, X-Requested-With, Accept, X-Tenant-Host, X-Tenant' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # Headers de Sécurité (Anti-XSS, Anti-Clickjacking, Sniffing)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Preflight OPTIONS — réponse immédiate sans passer par PHP
    if ($request_method = 'OPTIONS') {
        return 204;
    }
    # =============================================
    # FIN CORS
    # =============================================

    # Bloquer l'accès au Web Profiler et à la Debug Toolbar Symfony
    location ~ ^/(_profiler|_wdt) {
        return 403;
    }

    # Bloquer immédiatement tous les fichiers cachés (.env, .git, etc.)
    location ~ /\. {
        return 404;
    }

    # =============================================
    # SIMULATEUR DE BUCKET PUBLIC (Servi directement par Nginx)
    # =============================================
    location ^~ /bucket-simulator/assets/uploads/ {
        alias /var/www/var/storage/public_bucket/assets/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $upload_svg_csp always;
    }

    location ^~ /bucket-simulator/uploads/ {
        alias /var/www/var/storage/public_bucket/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $upload_svg_csp always;
    }

    # Rétrocompatibilité pour anciennes URLs sans passer par PHP
    location ^~ /assets/uploads/ {
        alias /var/www/var/storage/public_bucket/assets/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $upload_svg_csp always;
    }

    location ^~ /uploads/ {
        alias /var/www/var/storage/public_bucket/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $upload_svg_csp always;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        set $fastcgi_https "";
        if ($http_x_forwarded_proto = "https") {
            set $fastcgi_https "on";
        }
        fastcgi_param HTTPS $fastcgi_https;

        # Assistant IA des landing pages : une réponse peut prendre plusieurs minutes (mode page : 300 s au plus
        # côté PHP). Le défaut (60 s) coupait la requête en 504 pendant que PHP terminait et consommait les crédits.
        fastcgi_read_timeout 330s;

        # APP_ENV=dev en attendant le serveur de prod : les erreurs 5xx de Symfony (page de debug avec code,
        # traces et arguments) sont remplacées par une page neutre. Le détail reste dans var/log/dev.log.
        fastcgi_intercept_errors on;
        error_page 500 502 503 504 $error_5xx_location;

        internal;
    }

    location @error_5xx_api {
        default_type application/json;
        return 500 '{"error":"Une erreur interne est survenue. Veuillez réessayer dans quelques instants."}';
    }

    location @error_5xx_html {
        default_type text/html;
        return 500 '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Erreur temporaire</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7f9;color:#1f2937}main{max-width:32rem;padding:2rem;text-align:center}p{color:#4b5563;line-height:1.5}</style></head><body><main><h1>Une erreur est survenue</h1><p>Le service rencontre un problème temporaire. Veuillez réessayer dans quelques instants.</p></main></body></html>';
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
