server {
    listen 80;
    server_name _;
    client_max_body_size 200M;

    root /var/www/public;
    index index.php;

    # =============================================
    # CORS — Multi-origin avec regex (Next.js local + domaines prod)
    # =============================================
    set $cors_origin "";

    if ($http_origin ~* "^https?://((.*\.)?arkanoa-media\.com|(www\.)?esgboost\.(ca|fr)|(www\.)?karaandb\.com|(www\.)?memoiresvivantes\.com|(.*\.)?backend-strapi\.online|(.*\.)?lintendantprive\.com|(.*\.)?lintendant\.com|(.*\.)?localhost(:[0-9]+)?)$") {
        set $cors_origin $http_origin;
    }

    add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Origin, X-Requested-With, Accept, X-Tenant-Host, X-Tenant' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # Preflight OPTIONS — réponse immédiate sans passer par PHP
    if ($request_method = 'OPTIONS') {
        return 204;
    }
    # =============================================
    # FIN CORS
    # =============================================

    # Bloquer l'accès au Web Profiler et à la Debug Toolbar Symfony
    location ~ ^/(_profiler|_wdt) {
        return 403;
    }

    # Bloquer immédiatement tous les fichiers cachés (.env, .git, etc.)
    location ~ /\. {
        return 404;
    }

    # =============================================
    # SIMULATEUR DE BUCKET PUBLIC (Servi directement par Nginx)
    # =============================================
    location ^~ /bucket-simulator/assets/uploads/ {
        alias /var/www/var/storage/public_bucket/assets/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ^~ /bucket-simulator/uploads/ {
        alias /var/www/var/storage/public_bucket/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Rétrocompatibilité pour anciennes URLs sans passer par PHP
    location ^~ /assets/uploads/ {
        alias /var/www/var/storage/public_bucket/assets/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ^~ /uploads/ {
        alias /var/www/var/storage/public_bucket/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        set $fastcgi_https "";
        if ($http_x_forwarded_proto = "https") {
            set $fastcgi_https "on";
        }
        fastcgi_param HTTPS $fastcgi_https;

        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
